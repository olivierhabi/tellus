# ---------------------------------------------------------------------------
# Docker Compose — Ontology Engine
# Services: PostgreSQL, OpenSearch, Kafka, Zookeeper, Schema Registry,
#           Keycloak, MinIO (S3-compatible object store), App
# ---------------------------------------------------------------------------

# Shared hardening defaults. Log rotation caps container log growth so a
# chatty or crash-looping service can't fill the host disk (a top cause of
# "everything went down at once" incidents). Merge into each service with
# `logging: *default-logging`.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # -------------------------------------------------------------------------
  # autoheal — the missing recovery half of our healthchecks.
  #
  # Docker Compose's `restart:` policy only reacts to a process EXITING; it
  # does NOT restart a container that goes `unhealthy` while its process is
  # still alive (e.g. a deadlocked server still holding the port). autoheal
  # watches the Docker socket and restarts any container whose healthcheck
  # has gone unhealthy. With AUTOHEAL_CONTAINER_LABEL=all it covers every
  # container that defines a healthcheck — no per-service label needed.
  #
  # This is what turns our healthchecks from "a red light on a dashboard"
  # into actual self-healing.
  # -------------------------------------------------------------------------
  autoheal:
    image: willfarrell/autoheal:1.2.0
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: all
      AUTOHEAL_INTERVAL: 10           # seconds between health sweeps
      AUTOHEAL_START_PERIOD: 30       # grace before the first action
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: 30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"

  # -------------------------------------------------------------------------
  # mem-monitor — memory pressure early-warning system.
  #
  # Polls `docker stats` every 60 s and writes structured log lines when any
  # container crosses the WARNING (80 %) or CRITICAL (90 %) threshold.
  # At CRITICAL it also triggers a graceful `docker restart` so the container
  # reclaims its heap before Docker's OOM-killer forces a hard kill — a hard
  # kill restarts the container too, but leaves no log trail and can corrupt
  # in-flight writes (Kafka log segments, ClickHouse merges, etc.).
  #
  # Cooldown: a container that was restarted is skipped for the next 5 minutes
  # so a genuinely busy service isn't restart-looped.
  #
  # Log lines are emitted to stdout (visible via `docker compose logs
  # mem-monitor`). In a deployed environment, ship these logs to your
  # log aggregator (CloudWatch Logs, Loki, etc.) for alerting.
  # -------------------------------------------------------------------------
  mem-monitor:
    image: docker:27-cli
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        WARN_PCT=80
        CRIT_PCT=90
        COOLDOWN=300
        declare_cooldowns() { :; }
        echo "[mem-monitor] started — warn=$${WARN_PCT}% crit=$${CRIT_PCT}% cooldown=$${COOLDOWN}s"
        while true; do
          NOW=$$(date +%s)
          docker stats --no-stream --format '{{.Name}} {{.MemPerc}} {{.MemUsage}}' 2>/dev/null \
          | while read -r name raw_pct usage; do
              pct=$$(printf '%.0f' "$${raw_pct%%%*}" 2>/dev/null) || continue
              [ -z "$$pct" ] && continue
              cooldown_key="/tmp/cooldown_$${name}"
              if [ -f "$$cooldown_key" ]; then
                last=$$(cat "$$cooldown_key")
                [ $$(( NOW - last )) -lt $$COOLDOWN ] && continue
              fi
              if [ "$$pct" -ge "$$CRIT_PCT" ]; then
                echo "[CRITICAL $$(date -Iseconds)] $$name at $${raw_pct} ($$usage) — restarting to reclaim heap before OOM kill"
                echo "$$NOW" > "$$cooldown_key"
                docker restart "$$name" >/dev/null 2>&1 || true
              elif [ "$$pct" -ge "$$WARN_PCT" ]; then
                echo "[WARN    $$(date -Iseconds)] $$name at $${raw_pct} ($$usage)"
              fi
            done
          sleep 60
        done
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.10"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command: >
      postgres
        -c wal_level=logical
        -c max_replication_slots=10
        -c max_wal_senders=10
    environment:
      POSTGRES_DB: tellus_db
      POSTGRES_USER: tellus
      POSTGRES_PASSWORD: ${PGPASSWORD:-changeme}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tellus -d tellus_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  # -------------------------------------------------------------------------
  # pg-backup — scheduled logical backups of the APP Postgres.
  #
  # The app's Postgres holds the only irreplaceable data (ontology, edits,
  # connectivity, credentials). Temporal's history is ephemeral and
  # Lakekeeper's catalog is rebuildable, so we back up THIS one on a schedule
  # with retention. Dumps land in ./backups/app on the host (gitignored) and
  # can be restored with `pg_restore`/`psql`. BACKUP_ON_START makes the first
  # dump happen immediately so the backup path is proven, not assumed.
  #
  # NOTE: this is logical backup only. Production also needs WAL archiving /
  # PITR and an OFF-HOST copy — a local dump on the same disk dies with the
  # disk. See docs/runbook for the gap.
  # -------------------------------------------------------------------------
  pg-backup:
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: tellus_db
      POSTGRES_USER: tellus
      POSTGRES_PASSWORD: ${PGPASSWORD:-changeme}
      SCHEDULE: "@daily"
      BACKUP_ON_START: "TRUE"
      BACKUP_KEEP_DAYS: "7"
      BACKUP_KEEP_WEEKS: "4"
      BACKUP_KEEP_MONTHS: "6"
      HEALTHCHECK_PORT: "8080"
    volumes:
      - ./backups/app:/backups
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    # The image's built-in healthcheck uses a 5-minute interval, which keeps the
    # container "starting" for ~5 min and needlessly stalls orchestration
    # readiness. Override with a fast probe against the same status endpoint
    # (HEALTHCHECK_PORT=8080) so a successful backup is reflected promptly.
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  opensearch:
    image: opensearchproject/opensearch:2.17.0
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      # OpenSearch 2.12+ enforces a strong initial admin password even when
      # the security plugin is disabled (the demo installer runs first).
      # Must be >=8 chars with upper/lower/digit/special. Security is still
      # disabled via `plugins.security.disabled=true` above; this value is
      # only consumed by the demo installer and never authenticated against.
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=Str0ng!P@ssw0rd-Tellus-9a7b3Cz
      # JVM sizing rule (see docs/phase1-os-sync-merge-investigation.md §3):
      # heap <= 50% of the container (ES/OS convention: leave >= 50% for the OS
      # filesystem cache / Lucene mmap segment pages); Xms=Xmx to avoid heap
      # resize pauses under bootstrap.memory_lock; MaxDirectMemorySize bounded
      # so heap+direct ~= 50% of the container. 1.5g heap + 512m direct = 2g
      # JVM = 50% of the 4g container; the other 2g is for Lucene mmap + overhead.
      - "OPENSEARCH_JAVA_OPTS=-Xms1536m -Xmx1536m -XX:MaxDirectMemorySize=512m"
      # Pin JVM heap + Lucene mmap segment pages in RAM (no swap). Requires the
      # memlock ulimit below. Replaces memswap_limit=-1 (unlimited swap), which
      # let mmap pages be swapped out under pressure -> GC/IO thrash -> the
      # ECONNRESET / "Request timed out" symptoms at ~2.1-2.5M docs.
      - bootstrap.memory_lock=true
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - osdata:/usr/share/opensearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    mem_limit: 4g
    cpus: "1.5"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      # Whitelist the four-letter words the healthcheck (`ruok`) and
      # operations tooling (`mntr`, `stat`) need. ZK 3.5+ refuses these
      # by default; without the whitelist the cp-zookeeper image starts
      # cleanly but the healthcheck always fails, which then blocks
      # `kafka:` from starting via depends_on.
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=ruok,srvr,stat,mntr,conf,cons,dirs,dump,envi,gtmk,hash,isro,wchc,wchp,wchs"
      # cp-zookeeper uses KAFKA_HEAP_OPTS for its JVM. Cap at 256 MB max;
      # start at 64 MB so the JVM only grabs memory it actually needs at idle.
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms64m"
    ports:
      - "127.0.0.1:2181:2181"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    restart: unless-stopped
    # init: true installs tini as PID 1 inside the container. Without it,
    # Kafka is PID 1 and cannot reap the child JVM processes that Confluent's
    # Telemetry reporter forks every few minutes — they accumulate as defunct
    # (zombie) entries in the kernel process table. We observed 200+ zombies
    # after 3 days of idle uptime, which will eventually exhaust the PID namespace.
    init: true
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Start the JVM heap at 256 MB and let it grow up to 1 GB on demand.
      # The previous implicit default was -Xms1G -Xmx1G: the JVM pre-committed
      # the full gigabyte at process start regardless of load, burning ~700 MB
      # of RSS for a broker with no active producers or consumers.
      KAFKA_HEAP_OPTS: "-Xmx1G -Xms256M"
      # Disable the Confluent telemetry phone-home reporter. This is the root
      # cause of the zombie process accumulation: the reporter forks a child JVM
      # every few minutes to ship usage metrics to Confluent. init:true above
      # reaps those zombies, but disabling the reporter stops them being created
      # in the first place. No functional impact — this is analytics-only.
      KAFKA_CONFLUENT_SUPPORT_METRICS_ENABLE: "false"
    ports:
      - "127.0.0.1:9092:9092"
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "2.0"
    memswap_limit: 1536M
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      # Cap heap at 256 MB; start at 128 MB. Schema Registry is a thin proxy
      # layer — 256 MB max heap is comfortable for hundreds of schemas.
      # Drops the idle footprint from ~312 MB to ~200 MB.
      SCHEMA_REGISTRY_HEAP_OPTS: "-Xmx256m -Xms128m"
    ports:
      - "127.0.0.1:8081:8081"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    restart: unless-stopped
    command: ["start-dev"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: dev-file
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: 8086
      KC_HOSTNAME_STRICT: "false"
      # Keycloak ships no explicit heap cap — without this the JVM applies its
      # ergonomic default (~25% of container limit = 192 MB max) but ignores
      # cgroup memory limits on some JDK versions and grabs far more. Setting
      # both bounds explicitly: 128 MB initial keeps startup lean; 384 MB max
      # leaves ~384 MB for Quarkus native memory, metaspace, and OS within the
      # 768 MB container limit.
      JAVA_OPTS_APPEND: "-Xms128m -Xmx384m"
    ports:
      - "127.0.0.1:8086:8086"
    volumes:
      - kcdata:/opt/keycloak/data
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.5"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

  # -------------------------------------------------------------------------
  # MinIO — S3-compatible object storage.
  #
  # Purpose: the backend uploads CSV datasets, Parquet rewrites, and
  # transaction files into object storage via `@aws-sdk/client-s3`
  # (see `src/services/storageService.ts`). The AWS SDK is pointed at
  # MinIO through the `S3_ENDPOINT` / `S3_ACCESS_KEY_ID` /
  # `S3_SECRET_ACCESS_KEY` env vars (see `.env` for the host-side
  # defaults: endpoint `http://localhost:9000`, bucket
  # `tellus-uploads`, creds `minioadmin`/`minioadmin`).
  #
  # Without this service, every `/datasets/:id/preview` call fails
  # with HTTP 400 `DATASOURCE_FILE_NOT_FOUND` because the backend's
  # `getObjectBuffer(file_path)` call hits `ECONNREFUSED` against
  # `localhost:9000` — that's the class of error the user hit on the
  # `/ontology-manager/.../datasources` page.
  #
  # Port mapping:
  #   9000 → S3 API (what the backend talks to)
  #   9001 → MinIO Console (browser UI at http://localhost:9001 —
  #          login minioadmin/minioadmin). Not used by app code.
  # -------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    healthcheck:
      # `mc ready local` is preferred but requires the mc client which
      # this image doesn't ship — the `/minio/health/live` endpoint is
      # the official liveness probe and returns 200 once the API is
      # accepting requests.
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # -------------------------------------------------------------------------
  # MinIO bucket bootstrap — runs once, creates the `tellus-uploads`
  # bucket the app expects. Uses the short-lived `mc` (MinIO client)
  # image so we don't have to teach the main backend container how to
  # self-provision its own bucket on first boot.
  #
  # This runs only on first `docker compose up`; Compose treats it as
  # a one-shot service because it exits 0 after `mb --ignore-existing`.
  # Subsequent boots skip it (bucket already there) or recreate it
  # idempotently if someone wiped the MinIO volume.
  # -------------------------------------------------------------------------
  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-minioadmin} ${S3_SECRET_ACCESS_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${S3_BUCKET:-tellus-uploads} &&
      mc mb --ignore-existing local/${ICEBERG_BUCKET:-iceberg-warehouse} &&
      echo 'MinIO buckets ${S3_BUCKET:-tellus-uploads} + ${ICEBERG_BUCKET:-iceberg-warehouse} ready.'
      "

  # -------------------------------------------------------------------------
  # Redis — overlay store backend (Task B7).
  #
  # The backend's overlay store (`src/services/overlay/getOverlayStore.ts`)
  # connects to `REDIS_URL` (see `.env`: redis://:tellus_overlay_pw@localhost:6379).
  # Without Redis it transparently falls back to an in-memory store, but the
  # in-memory store does not survive a restart and is not shared across
  # processes — so for real testing we run Redis. The password here MUST match
  # the one embedded in `.env`'s REDIS_URL (`tellus_overlay_pw`).
  # -------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # --appendonly yes turns on AOF so the overlay store survives a Redis
    # restart instead of losing everything since the last RDB snapshot.
    # maxmemory + allkeys-lru bounds memory and degrades gracefully (evicts
    # cold keys) instead of OOM-killing the container under load.
    command:
      - "redis-server"
      - "--requirepass"
      - "tellus_overlay_pw"
      - "--appendonly"
      - "yes"
      - "--maxmemory"
      - "384mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a tellus_overlay_pw ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # -------------------------------------------------------------------------
  # ClickHouse — link-traversal analytics store (Task LT-B1 / search-around).
  #
  # `src/services/searchAround/clickhouseClient.ts` talks to it over HTTP
  # (CLICKHOUSE_URL=http://localhost:8123) as user `tellus`. The backend
  # creates its own MergeTree tables on bootstrap; we only need the server
  # up with the matching user/password/database. Native port 9000 collides
  # with MinIO so we deliberately do NOT publish it — the app only uses 8123.
  # -------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-tellus}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-tellus_ch_pw}
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-default}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:8123:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - chdata:/var/lib/clickhouse
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    memswap_limit: 2G
    healthcheck:
      # `localhost` resolves to IPv6 ::1 inside this image, where ClickHouse
      # isn't listening — use the IPv4 loopback explicitly.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # -------------------------------------------------------------------------
  # Temporal — workflow orchestration for the Funnel (Task FNL).
  #
  # `src/services/funnel/temporal/worker.ts` connects to TEMPORAL_ADDRESS
  # (localhost:7233) in namespace `tellus-funnel`. When Temporal is down the
  # PG-backed dispatcher stays primary — so this is best-effort.
  #
  # SPOF removal: Temporal runs on its OWN Postgres (temporal-postgres), not
  # the app's. Losing the orchestration store no longer takes the app's data
  # down with it, and vice versa. Temporal's workflow history is ephemeral for
  # our purposes (the PG dispatcher is the source of truth), so this instance
  # starts fresh — auto-setup builds the schema and temporal-init re-registers
  # the namespace.
  # -------------------------------------------------------------------------
  temporal-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: temporal
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_PG_PASSWORD:-temporal_pw}
    volumes:
      - temporal_pgdata:/var/lib/postgresql/data
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 3s
      retries: 5

  temporal:
    image: temporalio/auto-setup:1.25.2
    restart: unless-stopped
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_PG_PASSWORD:-temporal_pw}
      POSTGRES_SEEDS: temporal-postgres
    ports:
      - "127.0.0.1:7233:7233"
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    healthcheck:
      # The frontend binds to the container address, not loopback, so probe
      # via the service alias. SERVING ⇒ healthy; anything else exits non-zero.
      test: ["CMD-SHELL", "temporal operator cluster health --address temporal:7233 | grep -q SERVING"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  # One-shot: register the `tellus-funnel` namespace the worker expects.
  # Retries until the Temporal frontend answers, then creates the namespace
  # idempotently. ($$ escapes shell vars from Compose interpolation.)
  temporal-init:
    image: temporalio/admin-tools:1.25
    restart: "no"
    depends_on:
      temporal:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for i in $$(seq 1 60); do
          if temporal operator cluster health --address temporal:7233 >/dev/null 2>&1; then break; fi
          echo "waiting for temporal frontend... ($$i)"; sleep 2;
        done
        temporal operator namespace describe --address temporal:7233 tellus-funnel >/dev/null 2>&1 \
          || temporal operator namespace create --address temporal:7233 --retention 72h tellus-funnel
        echo "temporal namespace tellus-funnel ready"

  # -------------------------------------------------------------------------
  # Lakekeeper — Iceberg REST catalog (Task B2).
  #
  # `src/services/funnel/lakekeeperClient.ts` calls the management + Iceberg
  # REST APIs at LAKEKEEPER_URL (localhost:8181), creating the `tellus-funnel`
  # warehouse (backed by the MinIO `iceberg-warehouse` bucket) and namespaces
  # itself. We just need the catalog serving, with its own PG database and a
  # one-time server bootstrap. When unreachable the app falls back to a PG
  # shim, so this is best-effort.
  #
  # SPOF removal: Lakekeeper runs on its OWN Postgres (lakekeeper-postgres),
  # not the app's. POSTGRES_DB auto-creates the `lakekeeper` database, so the
  # old `lakekeeper-db-init` step is gone. Existing catalog metadata was
  # migrated off the app DB via `scripts/migrate-split-dbs.sh` (pg_dump |
  # pg_restore), so warehouses/namespaces are preserved. Steps now: migrate
  # schema → serve → POST server bootstrap.
  # -------------------------------------------------------------------------
  lakekeeper-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lakekeeper
      POSTGRES_USER: lakekeeper
      POSTGRES_PASSWORD: ${LAKEKEEPER_PG_PASSWORD:-lakekeeper_pw}
    volumes:
      - lakekeeper_pgdata:/var/lib/postgresql/data
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lakekeeper -d lakekeeper"]
      interval: 5s
      timeout: 3s
      retries: 5

  lakekeeper-migrate:
    image: quay.io/lakekeeper/catalog:v0.12.3@sha256:519773ef486d62fd93019bc763d7c0ce71dbb6fce041ccc915cee604649c3db8
    restart: "no"
    depends_on:
      lakekeeper-postgres:
        condition: service_healthy
    command: ["migrate"]
    environment:
      LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_PG_ENCRYPTION_KEY}
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://lakekeeper:${LAKEKEEPER_PG_PASSWORD:-lakekeeper_pw}@lakekeeper-postgres:5432/lakekeeper
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://lakekeeper:${LAKEKEEPER_PG_PASSWORD:-lakekeeper_pw}@lakekeeper-postgres:5432/lakekeeper

  lakekeeper:
    image: quay.io/lakekeeper/catalog:v0.12.3@sha256:519773ef486d62fd93019bc763d7c0ce71dbb6fce041ccc915cee604649c3db8
    restart: unless-stopped
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
    command: ["serve"]
    environment:
      LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_PG_ENCRYPTION_KEY}
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://lakekeeper:${LAKEKEEPER_PG_PASSWORD:-lakekeeper_pw}@lakekeeper-postgres:5432/lakekeeper
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://lakekeeper:${LAKEKEEPER_PG_PASSWORD:-lakekeeper_pw}@lakekeeper-postgres:5432/lakekeeper
    ports:
      - "127.0.0.1:8181:8181"
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
    healthcheck:
      # Distroless image — no shell/curl. The binary ships its own probe.
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  lakekeeper-bootstrap:
    image: curlimages/curl:8.10.1
    restart: "no"
    depends_on:
      lakekeeper:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $$(seq 1 60); do
          if curl -sf http://lakekeeper:8181/health >/dev/null 2>&1; then break; fi
          echo "waiting for lakekeeper... ($$i)"; sleep 2;
        done
        curl -s -o /dev/null -w "bootstrap HTTP %{http_code}\n" -X POST \
          http://lakekeeper:8181/management/v1/bootstrap \
          -H 'content-type: application/json' \
          -d '{"accept-terms-of-use": true}' || true
        echo "lakekeeper bootstrap attempted"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      minio:
        condition: service_healthy
      # Best-effort dependencies: the app degrades gracefully when these are
      # down (overlay→in-memory, link traversal disabled, PG-backed dispatcher
      # stays primary, Iceberg→PG shim). Gating startup on their *health* would
      # let one of them take the whole app offline — so we only order startup
      # (service_started), never block readiness on them.
      redis:
        condition: service_started
      clickhouse:
        condition: service_started
      temporal:
        condition: service_started
      lakekeeper:
        condition: service_started
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: tellus_db
      PGUSER: tellus
      PGPASSWORD: ${PGPASSWORD:-changeme}
      OPENSEARCH_URL: http://opensearch:9200
      KAFKA_BROKERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      KEYCLOAK_URL: http://keycloak:8086
      KEYCLOAK_REALM: tellus
      KEYCLOAK_CLIENT_ID: tellus-frontend
      # Point the AWS SDK at the in-cluster MinIO. These override the
      # `.env` defaults (which assume host-side `localhost:9000`) when
      # the app is containerised.
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-tellus-uploads}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_FORCE_PATH_STYLE: "true"
      # Overlay store → Redis (in-cluster). Overrides the .env localhost URL.
      REDIS_URL: redis://:tellus_overlay_pw@redis:6379
      # Link-traversal analytics → ClickHouse (in-cluster).
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-tellus}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-tellus_ch_pw}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-default}
      # Funnel orchestration → Temporal (in-cluster).
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-tellus-funnel}
      # Iceberg REST catalog → Lakekeeper (in-cluster). The warehouse storage
      # endpoint must be reachable from the Lakekeeper container, hence minio:9000.
      LAKEKEEPER_URL: http://lakekeeper:8181
      ICEBERG_S3_ENDPOINT: http://minio:9000
      PORT: 3000
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - appdata:/app/data
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  osdata:
  kcdata:
  appdata:
  miniodata:
  redisdata:
  chdata:
  temporal_pgdata:
  lakekeeper_pgdata:
