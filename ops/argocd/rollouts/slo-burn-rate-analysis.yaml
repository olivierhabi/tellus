apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: slo-burn-rate
  namespace: tellus
spec:
  metrics:
    - name: read-p99
      interval: 1m
      successCondition: result <= 0.250
      failureLimit: 3
      provider:
        prometheus:
          address: http://prometheus.monitoring:9090
          query: |
            histogram_quantile(0.99, sum(rate(tellus_http_request_duration_seconds_bucket{route=~"/api/v1/ontology/.+/objects/.+",status=~"2.."}[5m])) by (le))
    - name: action-p99
      interval: 1m
      successCondition: result <= 0.800
      failureLimit: 3
      provider:
        prometheus:
          address: http://prometheus.monitoring:9090
          query: |
            histogram_quantile(0.99, sum(rate(tellus_http_request_duration_seconds_bucket{route=~"/api/v1/actionTypes/.+/apply",status=~"2.."}[5m])) by (le))
    - name: error-rate
      interval: 1m
      successCondition: result <= 0.001
      failureLimit: 2
      provider:
        prometheus:
          address: http://prometheus.monitoring:9090
          query: |
            sum(rate(tellus_http_requests_total{status=~"5.."}[5m])) / sum(rate(tellus_http_requests_total[5m]))
    - name: audit-chain-break
      interval: 5m
      successCondition: result == 0
      failureLimit: 1
      provider:
        prometheus:
          address: http://prometheus.monitoring:9090
          query: sum(increase(tellus_audit_chain_breaks_total[10m]))
