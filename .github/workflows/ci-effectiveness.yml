# =============================================================================
# Weekly CI effectiveness report (docs/ci.md)
#
# Failure counts per tier, escaped-failure rate (green PR → red merge queue /
# post-merge, green merge queue → red nightly) and a recommendation on whether
# path-based test selection is too aggressive or too conservative. Read-only.
# =============================================================================
name: CI effectiveness

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      days:
        description: Look-back window in days.
        type: number
        default: 7

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  report:
    name: CI effectiveness report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.12.0
      - name: Build report
        env:
          GH_TOKEN: ${{ github.token }}
          DAYS: ${{ inputs.days || 7 }}
          OUT: ci-effectiveness.json
        run: node scripts/ci/ci-effectiveness.mjs
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-effectiveness
          path: ci-effectiveness.json
          if-no-files-found: ignore
          retention-days: 90
