# =============================================================================
# Tellus — Deploy pipeline (tag-gated)
#
# Runs on semver tags (v*) and on manual dispatch:
#   1. image     — Docker build of the API image + SBOM artifact.
#   2. manifests — Helm lint for the tenant chart + client-side dry-run
#                  validation of the raw k8s / infra manifests.
#
# This is intentionally build-and-validate: promotion to an environment
# happens by pointing the environment at the built tag. Registry push is
# wired when REGISTRY_* secrets are configured (optional).
# =============================================================================

name: deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  # Force JavaScript actions still bundled for Node 20 to run under Node 24
  # (GitHub deprecation: Node 20 removed from runners on 2026-09-16).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  image:
    name: Build API image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push — promotion by tag)
        run: docker build -f Dockerfile -t tellus:${{ github.ref_name }} .

      - name: SBOM
        run: ./scripts/generate-sbom.sh

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ github.ref_name }}
          path: ops/sbom/
          retention-days: 30

  manifests:
    name: Validate manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Helm lint (tenant chart)
        run: helm lint deploy/substrate/charts/tellus-tenant

      - name: Dry-run validate raw manifests
        # --validate=false keeps this a client-side syntax gate (no cluster,
        # no schema downloads); CRD-backed files (external-secrets, etc.)
        # are parse-checked only.
        run: |
          kubectl apply --dry-run=client --validate=false -f k8s/ -R
          kubectl apply --dry-run=client --validate=false -f infra/k8s/ -R
