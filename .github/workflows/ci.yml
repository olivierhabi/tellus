# =============================================================================
# Ontology Engine — CI Pipeline (tiered). Full design: docs/ci.md
#
#   Tier 1  every PR / MQ / push   lint, typecheck, unit (+coverage gate,
#                                  CVE scan, secret scan) and the integration
#                                  SMOKE set (auth, DB connectivity, core
#                                  read + action APIs). Target < 10 min.
#   Tier 2  pull_request           integration tests SELECTED by changed paths
#                                  (.github/ci/test-selection.json). Core /
#                                  shared / build files and anything
#                                  unclassified => the full suite.
#   Tier 3  merge_group            full integration suite (8 shards) + E2E,
#                                  perf, test:all, Docker build. Also on push
#                                  to main/master/develop.
#   Tier 4  nightly.yml            full suite incl. slow suites, unsharded.
#   Tier 5  `run-full-ci` label or workflow_dispatch(run_full) => Tier 3 set
#                                  on demand.
#
# Branch protection should require ONLY the `ci-gate` check (docs/ci.md).
# =============================================================================

name: CI

on:
  pull_request:
    branches: [main, master, develop]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      run_full:
        description: Run the full suite (Tier 5). false = Tier 1 + smoke only.
        type: boolean
        default: true

permissions:
  contents: read

# Superseded PR runs are cancelled; merge-queue and protected-branch runs are
# never cancelled. Label events other than `run-full-ci` get their own group so
# an unrelated label never cancels an in-flight PR run.
concurrency:
  group: >-
    ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}${{
    (github.event.action == 'labeled' || github.event.action == 'unlabeled')
    && github.event.label.name != 'run-full-ci'
    && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ---------------------------------------------------------------------------
  # Tier 1 — static checks + unit tests (reusable, also used by nightly)
  # ---------------------------------------------------------------------------
  tier1:
    name: Tier 1
    uses: ./.github/workflows/_tier1.yml
    permissions:
      contents: read
    secrets: inherit

  coverage:
    name: Coverage
    uses: ./.github/workflows/coverage-gate.yml
    permissions:
      contents: read

  security-scan:
    name: Security
    uses: ./.github/workflows/cve-scan.yml
    permissions:
      contents: read

  # Secret scanning — fails the build when a NEW commit introduces a
  # credential (PR/push commits, gitleaks default). gitleaks-action does not
  # support merge_group events; the same commits were already scanned on the
  # PR, so it is skipped there (skipped == pass in ci-gate).
  secret-scan:
    name: Secret scan
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # gitleaks-action lists PR commits via the REST API and posts findings
      # as a PR comment — needs write on pull-requests.
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          # Pin 8.30.1: .gitleaks.toml uses the [[allowlists]] array form.
          GITLEAKS_VERSION: 8.30.1

  # ---------------------------------------------------------------------------
  # Tier 1 — integration smoke (minimal ephemeral stack, ~4 tests)
  # ---------------------------------------------------------------------------
  smoke:
    name: Smoke
    uses: ./.github/workflows/_integration.yml
    permissions:
      contents: read
    secrets: inherit
    with:
      label: smoke
      mode: smoke
      stack: minimal
      timeout-minutes: 15

  # ---------------------------------------------------------------------------
  # Tier 2/3/5 planner — decides selective vs full from changed paths
  # ---------------------------------------------------------------------------
  plan:
    name: Plan tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter lists PR files via the API
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      matrix: ${{ steps.plan.outputs.matrix }}
      integration: ${{ steps.plan.outputs.integration }}
      extended: ${{ steps.plan.outputs.extended }}
      docker: ${{ steps.plan.outputs.docker }}
      quarantine: ${{ steps.plan.outputs.quarantine }}
    steps:
      - name: Checkout planner config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/ci
            scripts/ci
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.12.0
      - name: Build path filters from .github/ci/test-selection.json
        id: filters
        run: |
          node scripts/ci/plan-tests.mjs filters "$RUNNER_TEMP/ci-filters.json"
          echo "path=$RUNNER_TEMP/ci-filters.json" >> "$GITHUB_OUTPUT"
      - name: Detect changed paths
        id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: ${{ steps.filters.outputs.path }}
          list-files: json
      - name: Plan
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_FULL: ${{ contains(github.event.pull_request.labels.*.name, 'run-full-ci') || (github.event_name == 'workflow_dispatch' && inputs.run_full) }}
          FILTER_OUTPUTS: ${{ toJSON(steps.changes.outputs) }}
        run: node scripts/ci/plan-tests.mjs plan

  # ---------------------------------------------------------------------------
  # Tier 2 (selected groups) / Tier 3+5 (8 full shards)
  # ---------------------------------------------------------------------------
  integration:
    name: Integration (${{ matrix.name }} ${{ matrix.shard }}/${{ matrix.total }})
    needs: plan
    if: needs.plan.outputs.integration == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/_integration.yml
    permissions:
      contents: read
    secrets: inherit
    with:
      label: ${{ matrix.name }}
      mode: tests
      filters: ${{ matrix.filters }}
      shard: ${{ matrix.shard }}
      shard-total: ${{ matrix.total }}
      timeout-minutes: 35

  # Known-flaky tests (quarantine list, each with a tracking issue). Runs on
  # full runs for signal only: NEVER blocks and is deliberately NOT a
  # dependency of ci-gate.
  quarantine:
    name: Quarantine (non-blocking)
    needs: plan
    if: needs.plan.outputs.quarantine == 'true'
    uses: ./.github/workflows/_integration.yml
    permissions:
      contents: read
    secrets: inherit
    with:
      label: quarantine
      mode: quarantine
      non-blocking: true
      timeout-minutes: 30

  # E2E / perf / test:all — full runs only (merge queue, push, label, dispatch)
  extended:
    name: Extended
    needs: plan
    if: needs.plan.outputs.extended == 'true'
    uses: ./.github/workflows/_extended.yml
    permissions:
      contents: read
    secrets: inherit

  docker-build:
    name: Docker build
    needs: plan
    if: needs.plan.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image (layer cache, no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: tellus-api:ci-${{ github.sha }}
          cache-from: type=gha,scope=tellus-api
          cache-to: type=gha,mode=max,scope=tellus-api

  # ---------------------------------------------------------------------------
  # Single required check. Passes only if every blocking job succeeded or was
  # intentionally skipped by the planner; fails on failure OR cancellation.
  # ---------------------------------------------------------------------------
  ci-gate:
    name: ci-gate
    if: always()
    needs:
      - tier1
      - coverage
      - security-scan
      - secret-scan
      - smoke
      - plan
      - integration
      - extended
      - docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check results of all blocking jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          MODE: ${{ needs.plan.outputs.mode }}
        run: |
          set -euo pipefail
          echo "plan mode: ${MODE:-unknown}"
          {
            echo "### ci-gate"
            echo ""
            echo "| Job | Result |"
            echo "|---|---|"
            jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<<"$NEEDS_JSON"
          } >> "$GITHUB_STEP_SUMMARY"
          bad="$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"' <<<"$NEEDS_JSON")"
          if [ -n "$bad" ]; then
            echo "::error::blocking jobs did not pass: $(echo "$bad" | tr '\n' ' ')"
            exit 1
          fi
          # A skipped planner means the selection itself never ran: fail closed.
          if [ "$(jq -r '.plan.result' <<<"$NEEDS_JSON")" != "success" ]; then
            echo "::error::plan job did not run"; exit 1
          fi
          echo "all blocking jobs passed or were intentionally skipped"
