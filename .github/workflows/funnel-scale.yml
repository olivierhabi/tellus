# =============================================================================
# Funnel scale (O1–O3) at production sizes — nightly + on demand.
# docs/adr/2026-10-09-funnel-fleet-simulation.md, tests/funnel/scale/.
# Production funnel profile (out-of-process DuckDB CLI merge) against
# Postgres 16 + MinIO; reports (wall time, maxRSS, buckets, kill points) are
# uploaded as an artifact and judged against tests/funnel/scale/budgets.json.
#
# Runner: GitHub-hosted `ubuntu-latest` — on a PUBLIC repository that is the
# standard 4 vCPU / 16 GB RAM Linux runner. The "Runner capacity" step fails
# fast if the job ever lands on a smaller machine, so budget results are only
# ever judged on that hardware.
#
# NOTE: `runner.*` is not available in job-level `env` (GitHub rejects the
# whole file — 0 jobs). Paths derived from runner.temp are exported from the
# first step via $GITHUB_ENV instead.
# =============================================================================
name: funnel-scale

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      sizes:
        description: JSON array of row counts
        default: "[1000000, 5000000, 10000000]"

permissions:
  contents: read

concurrency:
  group: funnel-scale-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scale:
    name: O1–O3 @ ${{ matrix.rows }} rows
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        rows: ${{ fromJSON(github.event.inputs.sizes || '[1000000, 5000000, 10000000]') }}
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: tellus
      PGPASSWORD: tellus123
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      MINIO_IMAGE: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
      TELLUS_DEPLOYMENT_STRICT: "1"
      TELLUS_EXPECT_OOP_MERGE: "1"
      TELLUS_FUNNEL_LANE: scale
      TELLUS_SCALE_ROWS: ${{ matrix.rows }}
      TELLUS_SCALE_REPORT_DIR: ${{ github.workspace }}/reports/funnel-scale
      # PG_STATEMENT_TIMEOUT_MS deliberately left at the shipped 60 s default:
      # the chunked promote must keep every statement under it at 5M/10M rows;
      # a 57014 here is a finding, never something to raise the timeout for.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_DB: tellus_db
          POSTGRES_USER: tellus
          POSTGRES_PASSWORD: tellus123
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U tellus -d tellus_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Runner capacity (expect 4 vCPU / 16 GB public-repo runner)
        run: |
          cpus=$(nproc)
          mem_gb=$(awk '/MemTotal/ {printf "%d", $2/1024/1024}' /proc/meminfo)
          echo "vCPU=${cpus} RAM=${mem_gb}GB"
          echo "### runner: ${cpus} vCPU, ${mem_gb} GB RAM" >> "$GITHUB_STEP_SUMMARY"
          # MemTotal reports slightly under the nominal 16 GB.
          if [ "$cpus" -lt 4 ] || [ "$mem_gb" -lt 15 ]; then
            echo "::error::funnel-scale needs a 4 vCPU / 16 GB runner, got ${cpus} vCPU / ${mem_gb} GB"
            exit 1
          fi
      - name: Scale workdir
        # runner.temp is only valid at step level — see header note.
        run: echo "TELLUS_SCALE_WORKDIR=${RUNNER_TEMP}/tellus-scale" >> "$GITHUB_ENV"
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm + Node.js + install
        uses: ./.github/actions/setup-pnpm
      - name: Start MinIO
        uses: ./.github/actions/start-lane-deps
        with:
          keycloak: "false"
      - name: Install DuckDB CLI (same pin as the image)
        uses: ./.github/actions/install-duckdb-cli
      - name: O1–O3
        run: pnpm exec vitest run --config vitest.funnel-oop.config.ts
      - name: Summary
        if: always()
        run: |
          {
            echo "### funnel-scale @ ${TELLUS_SCALE_ROWS} rows"
            for f in reports/funnel-scale/*.json; do
              [ -f "$f" ] || continue
              echo "#### $(basename "$f")"; echo '```json'; cat "$f"; echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: funnel-scale-${{ matrix.rows }}
          path: reports/
          if-no-files-found: ignore
