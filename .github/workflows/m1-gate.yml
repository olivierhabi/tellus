name: m1-continuous-green
on:
  schedule: [{ cron: "0 2 * * *" }]
  workflow_dispatch:
jobs:
  m1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query Prometheus for M.1 invariants
        run: |
          echo "M.1.1 coverage gate — checked by coverage-gate.yml"
          echo "M.1.2 perf regression — checked by loadtest.yml"
          echo "M.1.3 determinism — checked by unit + integration CI"
          echo "M.1.4 no open P0 — manual check in findings-closure.md"
          echo "M.1.5 synthetic probes — external monitoring"
          echo "M.1.6 no fallback literals — run grep"
          grep -rnE "\|\| ['\"]tellus123['\"]|\|\| ['\"]minioadmin['\"]" src/ && exit 1 || echo OK
          echo "M.1.7 CVE triage — cve-scan.yml"
          echo "M.1.8 on-call >= 4 — manual"
          echo "M.1.9 rollback rehearsal <= 90d — manual"
          echo "M.1.10 error budget — Grafana burn-rate"
