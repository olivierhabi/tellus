# ---------------------------------------------------------------------------
# k8s/external-secrets/s3-keycloak-jwt.yaml
#
# F-P4-25 rotation closure for S3/MinIO, Keycloak client, JWT signing
# keys, and Temporal credentials. Paired with docs/SECRETS.md §2-§5.
# ---------------------------------------------------------------------------
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tellus-s3
  namespace: tellus
  annotations:
    reloader.stakater.com/match: "true"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets
    kind: SecretStore
  target:
    name: tellus-s3-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        S3_ACCESS_KEY_ID: "{{ .access_key }}"
        S3_SECRET_ACCESS_KEY: "{{ .secret_key }}"
        S3_ENDPOINT: "{{ .endpoint }}"
        S3_REGION: "{{ .region }}"
  data:
    - { secretKey: access_key, remoteRef: { key: /tellus/prod/s3, property: access_key_id } }
    - { secretKey: secret_key, remoteRef: { key: /tellus/prod/s3, property: secret_access_key } }
    - { secretKey: endpoint,   remoteRef: { key: /tellus/prod/s3, property: endpoint } }
    - { secretKey: region,     remoteRef: { key: /tellus/prod/s3, property: region } }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tellus-keycloak
  namespace: tellus
  annotations:
    reloader.stakater.com/match: "true"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets
    kind: SecretStore
  target:
    name: tellus-keycloak-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        KEYCLOAK_URL: "{{ .url }}"
        KEYCLOAK_REALM: "{{ .realm }}"
        KEYCLOAK_CLIENT_ID: "{{ .client_id }}"
        KEYCLOAK_CLIENT_SECRET: "{{ .client_secret }}"
        KEYCLOAK_ADMIN_USER: "{{ .admin_user }}"
        KEYCLOAK_ADMIN_PASSWORD: "{{ .admin_password }}"
  data:
    - { secretKey: url,             remoteRef: { key: /tellus/prod/keycloak, property: url } }
    - { secretKey: realm,           remoteRef: { key: /tellus/prod/keycloak, property: realm } }
    - { secretKey: client_id,       remoteRef: { key: /tellus/prod/keycloak, property: client_id } }
    - { secretKey: client_secret,   remoteRef: { key: /tellus/prod/keycloak, property: client_secret } }
    - { secretKey: admin_user,      remoteRef: { key: /tellus/prod/keycloak, property: admin_user } }
    - { secretKey: admin_password,  remoteRef: { key: /tellus/prod/keycloak, property: admin_password } }
---
# JWT signing keys for Tellus-minted tokens (if any). Rotate every 30 days
# with overlap: JWT_SIGNING_KEY is the active key; JWT_SIGNING_KEY_PREVIOUS
# is still accepted by verifiers for the rotation grace window.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tellus-jwt
  namespace: tellus
  annotations:
    reloader.stakater.com/match: "true"
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: aws-secrets
    kind: SecretStore
  target:
    name: tellus-jwt-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        JWT_SIGNING_KEY: "{{ .active }}"
        JWT_SIGNING_KEY_PREVIOUS: "{{ .previous }}"
  data:
    - { secretKey: active,   remoteRef: { key: /tellus/prod/jwt, property: active_pem } }
    - { secretKey: previous, remoteRef: { key: /tellus/prod/jwt, property: previous_pem } }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tellus-temporal
  namespace: tellus
  annotations:
    reloader.stakater.com/match: "true"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets
    kind: SecretStore
  target:
    name: tellus-temporal-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        TEMPORAL_ADDRESS: "{{ .address }}"
        TEMPORAL_NAMESPACE: "{{ .namespace }}"
        TEMPORAL_CLIENT_CERT: "{{ .client_cert }}"
        TEMPORAL_CLIENT_KEY: "{{ .client_key }}"
  data:
    - { secretKey: address,     remoteRef: { key: /tellus/prod/temporal, property: address } }
    - { secretKey: namespace,   remoteRef: { key: /tellus/prod/temporal, property: namespace } }
    - { secretKey: client_cert, remoteRef: { key: /tellus/prod/temporal, property: client_cert_pem } }
    - { secretKey: client_key,  remoteRef: { key: /tellus/prod/temporal, property: client_key_pem } }
