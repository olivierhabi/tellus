# ---------------------------------------------------------------------------
# k8s/external-secrets/pg.yaml
#
# Closes the rotation half of F-P4-25 (no vault integration). Paired with
# the in-process fail-closed requireSecret() guard from Block A.
#
# Uses External Secrets Operator (ESO) to pull the Tellus PG password
# from AWS Secrets Manager every 1h. ESO writes a K8s Secret which the
# Pod mounts as an env var; on rotation, the Secret resource updates and
# the Pod sees the new value via a restart triggered by reloader.
#
# Prerequisites:
#   1. ESO CRDs installed in the cluster (external-secrets.io/v1beta1).
#   2. A SecretStore named `aws-secrets` pointing at the account that
#      holds the Tellus secrets. Example config below.
#   3. IAM policy allowing the ESO service account to read secrets under
#      `/tellus/prod/*`.
#
# Rotation: configure a 90-day rotation schedule on the AWS secret via
#           `aws secretsmanager rotate-secret`. The Lambda rotates the
#           PG password (in sync with PG's ALTER USER) and writes the
#           new value back to Secrets Manager. ESO picks up the change
#           on the next refresh and stamps the new Secret resource.
# ---------------------------------------------------------------------------
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tellus-pg
  namespace: tellus
  annotations:
    reloader.stakater.com/match: "true"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets
    kind: SecretStore
  target:
    name: tellus-pg-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        PGPASSWORD: "{{ .password }}"
        PGUSER: "{{ .username }}"
  data:
    - secretKey: password
      remoteRef:
        key: /tellus/prod/pg
        property: password
    - secretKey: username
      remoteRef:
        key: /tellus/prod/pg
        property: username
---
# Example SecretStore — one per cluster. Not a secret itself (contains no
# credentials); uses IRSA for authn.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets
  namespace: tellus
spec:
  provider:
    aws:
      service: SecretsManager
      region: af-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
