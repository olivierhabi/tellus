# ---------------------------------------------------------------------------
# k8s/external-secrets/kek-superadmin.yaml
#
# F-03 closure: externalize the credential-vault master key (KEK) and the
# bootstrap superadmin credentials. Both were previously sourced from a baked
# .env — a filesystem read of that .env yielded the full vault master key
# (which decrypts EVERY stored connection credential) plus the superadmin
# password. They now come from AWS Secrets Manager via ESO, the same delivery
# path as pg / s3 / keycloak (see docs/SECRETS.md).
#
# KEK rotation is NOT a simple value swap: rotating TELLUS_LOCAL_KEK_B64
# requires envelope re-encryption of every stored DEK / credential (decrypt
# with the old key, re-encrypt with the new) BEFORE the old key is retired.
# Use the KEK rekey runbook / scripts/rotate-secret.sh KEK path — never
# overwrite the Secrets Manager value alone, or all existing ciphertext
# becomes undecryptable.
# ---------------------------------------------------------------------------
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tellus-kek
  namespace: tellus
  annotations:
    reloader.stakater.com/match: "true"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets
    kind: SecretStore
  target:
    name: tellus-kek-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        TELLUS_LOCAL_KEK_B64: "{{ .kek_b64 }}"
  data:
    - secretKey: kek_b64
      remoteRef:
        key: /tellus/prod/kek
        property: kek_b64
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tellus-superadmin
  namespace: tellus
  annotations:
    reloader.stakater.com/match: "true"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets
    kind: SecretStore
  target:
    name: tellus-superadmin-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        TELLUS_SUPERADMIN_EMAIL: "{{ .email }}"
        TELLUS_SUPERADMIN_PASSWORD: "{{ .password }}"
  data:
    - { secretKey: email,    remoteRef: { key: /tellus/prod/superadmin, property: email } }
    - { secretKey: password, remoteRef: { key: /tellus/prod/superadmin, property: password } }
