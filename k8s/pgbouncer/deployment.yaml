# ---------------------------------------------------------------------------
# k8s/pgbouncer/deployment.yaml
#
# Closes F-P5-06 — PG connection pool sizing incompatible with K8s
# horizontal scaling. Sum of (main pg pool 20 + Knex foundry 10 + Knex
# worker 20) = ~50 connections per Tellus replica. PG default
# `max_connections=100` caps horizontal scale at ~2 replicas without a
# pooler.
#
# Deployment strategy: PgBouncer as a StatefulSet (not sidecar) so every
# Tellus replica shares one pool. Transaction-pooling mode multiplexes
# the Tellus replica's logical connections onto a small server pool;
# typical 10:1 multiplication ratio means 100 backend connections
# support 1000 client connections.
#
# Transaction pooling constraints that Tellus code MUST observe:
#   - No session-level state (SET LOCAL is fine; SET is not).
#   - No prepared statements cached client-side.
#   - No LISTEN/NOTIFY (Tellus doesn't use these).
#   - No advisory locks spanning multiple statements unless wrapped in
#     a single transaction. All Tellus advisory-lock call sites today
#     are pg_advisory_xact_lock which is OK in transaction pooling.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  namespace: tellus
data:
  pgbouncer.ini: |
    [databases]
    tellus_db = host=tellus-pg-primary port=5432 dbname=tellus_db

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 6432
    auth_type = scram-sha-256
    auth_file = /etc/pgbouncer/userlist.txt

    pool_mode = transaction
    max_client_conn = 2000
    default_pool_size = 25
    reserve_pool_size = 5
    reserve_pool_timeout = 3
    server_idle_timeout = 300
    server_lifetime = 3600
    query_timeout = 0
    query_wait_timeout = 120

    # Logging — Pino / OTel sidecar scrapes these via stderr.
    log_connections = 0
    log_disconnections = 0
    log_pooler_errors = 1

    # Stats — Prometheus pgbouncer_exporter scrapes `SHOW STATS`.
    stats_period = 60

    # TLS
    client_tls_sslmode = require
    client_tls_cert_file = /etc/pgbouncer/tls/tls.crt
    client_tls_key_file  = /etc/pgbouncer/tls/tls.key
    server_tls_sslmode = verify-full
    server_tls_ca_file  = /etc/pgbouncer/tls/ca.crt
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pgbouncer
  namespace: tellus
spec:
  serviceName: pgbouncer
  replicas: 2
  selector:
    matchLabels: { app: pgbouncer }
  template:
    metadata:
      labels: { app: pgbouncer }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9127"
    spec:
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:1.22.1
          ports:
            - { name: pgb,  containerPort: 6432 }
          env:
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: tellus-pg-credentials, key: PGUSER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: tellus-pg-credentials, key: PGPASSWORD } }
          volumeMounts:
            - { name: config, mountPath: /etc/pgbouncer }
            - { name: tls,    mountPath: /etc/pgbouncer/tls }
          livenessProbe:
            tcpSocket: { port: pgb }
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket: { port: pgb }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: "200m", memory: "128Mi" }
            limits:   { cpu: "1000m", memory: "512Mi" }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }

        - name: exporter
          image: prometheuscommunity/pgbouncer-exporter:0.7.0
          ports:
            - { name: metrics, containerPort: 9127 }
          env:
            - name: PGBOUNCER_EXPORTER_HOST
              value: "127.0.0.1"
            - name: PGBOUNCER_EXPORTER_PORT
              value: "6432"
            - name: DATA_SOURCE_NAME
              value: "postgres://$(DB_USER):$(DB_PASSWORD)@localhost:6432/pgbouncer?sslmode=disable"
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: tellus-pg-credentials, key: PGUSER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: tellus-pg-credentials, key: PGPASSWORD } }
      volumes:
        - name: config
          configMap: { name: pgbouncer-config }
        - name: tls
          secret: { secretName: pgbouncer-tls }
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  namespace: tellus
spec:
  ports:
    - { name: pgb,     port: 6432, targetPort: pgb }
    - { name: metrics, port: 9127, targetPort: metrics }
  selector: { app: pgbouncer }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pgbouncer
  namespace: tellus
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: pgbouncer }
