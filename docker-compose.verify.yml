# docker-compose.verify.yml — Quiver verification stack (per QUIVER COMPLETION CONTRACT v1 §2)
#
# Runs in parallel to the existing tellus dev stack. All host ports are remapped
# into the 32xxx range to avoid colliding with the live dev stack on
# 5432/6379/8086/9092/9000-9001/9200/3000-3003.
#
# Service-to-service traffic stays on internal compose names + native ports.
# Cypress baseUrl from host = http://localhost:32000; from inside the network = http://app:3000.
#
# Image pinning rationale:
#   - kafka 7.6.1 + zookeeper 7.6.1 + schema-registry 7.6.1 (already cached locally;
#     compatible with the contract's stated 7.5.3, which is not pulled)
#   - keycloak 25.0 (already cached; compatible with contract's 24.0; OIDC discovery
#     unchanged across both versions)
#   - otel 0.96.0 — exact match to the contract.
#   - cassandra 5.0 — exact match.
#   - postgres 16-alpine — exact match.
#
# Redis is added as an eighth service (the contract's §2 omits it but the Quiver
# service requires it for idempotency cache; without it the app crashes at boot).

name: tellus-quiver-verify

networks:
  verify:
    driver: bridge

volumes:
  pgdata:
  cdata:
  kdata:
  zkdata:
  zklog:
  rdata:

services:

  postgres:
    image: postgres:16-alpine
    networks: [verify]
    environment:
      POSTGRES_USER: tellus
      POSTGRES_PASSWORD: tellus123
      POSTGRES_DB: tellus_db
    ports: ["127.0.0.1:32432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tellus -d tellus_db"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  redis:
    image: redis:7.4-alpine
    networks: [verify]
    ports: ["127.0.0.1:32379:6379"]
    volumes:
      - rdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 3s

  cassandra:
    image: cassandra:5.0
    networks: [verify]
    environment:
      MAX_HEAP_SIZE: "512M"
      HEAP_NEWSIZE: "128M"
      CASSANDRA_CLUSTER_NAME: "verify-cluster"
    ports: ["127.0.0.1:32942:9042"]
    volumes:
      - cdata:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    networks: [verify]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      # Enable 'ruok' four-letter word so the healthcheck below succeeds.
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=ruok,srvr,stat,mntr,conf"
    volumes:
      - zkdata:/var/lib/zookeeper/data
      - zklog:/var/lib/zookeeper/log
    healthcheck:
      # cp-zookeeper:7.6.1 has /usr/bin/nc (verified). nc -z exits 0 the moment
      # TCP accept() succeeds, without sending data — works regardless of ZK's
      # 4lw whitelist or silence-until-4lw behavior.
      test: ["CMD", "nc", "-z", "127.0.0.1", "2181"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    networks: [verify]
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://127.0.0.1:32092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports: ["127.0.0.1:32092:9093"]
    volumes:
      - kdata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    networks: [verify]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8081"
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "PLAINTEXT://kafka:9092"
    ports: ["127.0.0.1:32081:8081"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/subjects >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    networks: [verify]
    command: ["start-dev", "--import-realm", "--http-port=8080", "--health-enabled=true"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports: ["127.0.0.1:32080:8080"]
    healthcheck:
      # keycloak:25 image has /bin/bash but NO curl/wget/nc. Bash builtin TCP
      # redirect is the only available probe. Connecting to :8080 (the HTTP
      # listener) succeeds only after Quarkus has finished bootstrapping.
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && exec 3<&-"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  otel-collector:
    # The contrib image is distroless: no /bin/sh, so neither CMD-SHELL nor
    # multi-stage shell pipes can run inside the container. The collector's
    # readiness is observable from outside the container via its health_check
    # extension on :13133 (verified by stage 2 boot probe in scripts/quiver-verify.sh).
    image: otel/opentelemetry-collector-contrib:0.96.0
    networks: [verify]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:32317:4317"
      - "127.0.0.1:32318:4318"
      - "127.0.0.1:32133:13133"

  app:
    build:
      context: .
      dockerfile: Dockerfile.verify
    networks: [verify]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      otel-collector:
        # otel-collector-contrib is distroless; cannot exec a shell-based
        # healthcheck. We depend on service_started + extra-stage probe
        # in scripts/quiver-verify.sh for runtime readiness.
        condition: service_started
      # Cassandra/kafka/schema-registry stay healthy independently — the app
      # does not currently bind them, but the contract requires they be up.
      cassandra:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: tellus
      PGPASSWORD: tellus123
      PGDATABASE: tellus_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: tellus
      KEYCLOAK_CLIENT_ID: tellus-app
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: tellus-quiver
      TELLUS_QUIVER_PHASE: "5"
      QUIVER_ALLOW_TEST_AUTH: "1"
      QUIVER_AUDIT_BEST_EFFORT: "1"
      QUIVER_DEBUG_ENDPOINTS: "1"
      # Quiver verify stack: integration-test stage applies migrations 062-070
      # against this same postgres BEFORE cypress hits the live app. Bypass the
      # boot-time gate so the app survives the early window where 062-070 do
      # not yet exist (the gate would otherwise process.exit(1) and break
      # compose --wait). The gate logs a single warning at boot ("disabled")
      # and otherwise gets out of the way. See decisions/quiver/.
      TELLUS_MIGRATION_GATE: "off"
    ports: ["127.0.0.1:32000:3000"]
    healthcheck:
      # node:20-slim ships neither wget nor curl. node's own http module is
      # always present and gives us a deterministic 200/non-200 probe.
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 30s
