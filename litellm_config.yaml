model_list:
  - model_name: glm-5.2
    litellm_params:
      model: openai/glm-5.2
      api_base: https://ws-8p464sqf20yfd2f2.cn-hongkong.maas.aliyuncs.com/compatible-mode/v1
      api_key: sk-ws-H.RMMERRY.obG1.MEYCIQCneEQCeMBCyCyvOH5i87aZUVhHgeDwFOu7Vv1mcLyY8wIhAP7On6K_Y6i_8ywwlSW3Yox-OdnayrJ5tZ2H_uQsV9lK
      # Keep drop_params on: the upstream 400s on some Claude-Code-only params.
      drop_params: true
      # LiteLLM's OpenAI->Anthropic streaming chunker drops the leading `{` of a
      # tool_call arguments object. glm-5.2 streams arguments as ~5 deltas, the
      # FIRST delta being just "{". include_usage forces a final usage chunk that
      # lets the proxy reconcile the complete tool call; it reduces the window
      # but does NOT fully fix the dropped-`{`. The real fix is disabling
      # streaming on the Claude Code client side (see CLAUDE.md / env notes).
      stream_options:
        include_usage: true
      # glm-5.2 is a reasoning model (emits reasoning_content before tool_calls).
      # 4096 was too tight and truncated tool generation mid-arguments.
      max_tokens: 20000
    model_info:
      max_tokens: 20000
      mode: chat
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0
