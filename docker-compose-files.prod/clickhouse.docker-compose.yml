# ---------------------------------------------------------------------------
# ClickHouse — Search-Arounds large-traversal tier (Task B10)
# ---------------------------------------------------------------------------
# For hops > 100k objects, Quickwit's term-set filter tips over. ClickHouse
# takes over via materialized views per link type populated from the
# Kafka CDC stream.
#
# This is a single-node shape fit for dev + small prod. The real prod
# topology is 3 shards × 2 replicas; provision a Kubernetes ClickHouse
# Operator cluster with a ReplicatedMergeTree engine. For local work the
# single-node MergeTree is a drop-in since the query planner is identical.
# ---------------------------------------------------------------------------
services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: tellus-clickhouse
    restart: unless-stopped
    ports:
      - "127.0.0.1:8123:8123" # HTTP
      - "127.0.0.1:9002:9000" # native TCP (9001 is MinIO console)
    environment:
      CLICKHOUSE_DB: ${CH_DB:-tellus_traversal}
      CLICKHOUSE_USER: ${CH_USER:-tellus}
      CLICKHOUSE_PASSWORD: ${CH_PASSWORD:-tellus_ch_pw}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      # Server-level librdkafka overrides for the Kafka engine — forces
      # auto_offset_reset=earliest so CDC messages produced during/before
      # the ClickHouse subscription handshake are not silently dropped.
      - ./clickhouse-config/kafka.xml:/etc/clickhouse-server/config.d/kafka.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  clickhouse_data:
