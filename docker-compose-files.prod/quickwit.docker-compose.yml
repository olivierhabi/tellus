# ---------------------------------------------------------------------------
# Quickwit — Indexing + Search tier (Tasks B6 / B8)
# ---------------------------------------------------------------------------
# Split-file model: immutable Tantivy segments on S3 (MinIO) with a
# hotcache footer so range-GET queries beat the cold-start tail. Metastore
# lives in Postgres so it shares backup lifecycle with the rest of the
# platform.
#
# For dev we run a single `combo` node (indexer + searcher + metastore in
# one process). For prod, split the roles: `indexer` as a StatefulSet with
# NVMe-backed data volumes, `searcher` as a Deployment with split-cache
# volumes, `metastore` as a stateless Deployment pointing at the same
# Postgres. This file shapes the indexer+searcher combo; the StatefulSet
# is the Kubernetes manifest under `infra/k8s/quickwit/`.
# ---------------------------------------------------------------------------
services:
  quickwit:
    image: quickwit/quickwit:0.8.1
    container_name: tellus-quickwit
    restart: unless-stopped
    command: ["run"]
    environment:
      # Use Postgres for the metastore so backups cover indexing state.
      QW_METASTORE_URI: postgres://${DB_USER:-tellus}:${DB_PASSWORD:-tellus123}@postgres:5432/${QW_METASTORE_DB:-quickwit_metastore}
      QW_DEFAULT_INDEX_ROOT_URI: s3://${QW_BUCKET:-quickwit-splits}/
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      QW_S3_ENDPOINT: http://minio:9000
      QW_S3_FORCE_PATH_STYLE_ACCESS: "true"
      QW_CLUSTER_ID: tellus-qw
      QW_NODE_ID: quickwit-1
    ports:
      - "127.0.0.1:7280:7280" # REST + search API
      - "127.0.0.1:7281:7281" # gRPC
    volumes:
      - quickwit_data:/quickwit/qwdata
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:7280/api/v1/health/livez"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "3"

  # One-shot: create the quickwit_metastore Postgres database.
  quickwit-metastore-init:
    image: postgres:16-alpine
    container_name: tellus-quickwit-metastore-init
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${DB_USER:-tellus}
      PGPASSWORD: ${DB_PASSWORD:-tellus123}
      QW_METASTORE_DB: ${QW_METASTORE_DB:-quickwit_metastore}
    entrypoint:
      - /bin/sh
      - -eu
      - -c
      - |
        until pg_isready -h postgres -U "$$PGUSER" >/dev/null 2>&1; do
          echo 'waiting for postgres...'; sleep 2;
        done
        psql -v ON_ERROR_STOP=1 -d postgres <<SQL
          SELECT 'CREATE DATABASE ' || quote_ident('$$QW_METASTORE_DB')
          WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = '$$QW_METASTORE_DB')\gexec
        SQL
        echo 'Quickwit metastore DB ready'
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  quickwit_data:
