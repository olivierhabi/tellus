services:
  postgres:
    image: postgres:16-alpine
    container_name: tellus-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-tellus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tellus123}
      POSTGRES_DB: ${DB_NAME:-tellus_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tellus} -d ${DB_NAME:-tellus_db}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  pgdata:
