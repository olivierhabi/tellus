# ---------------------------------------------------------------------------
# Lakekeeper — Iceberg REST catalog (Task B2)
# ---------------------------------------------------------------------------
# Spec equivalent: the "Iceberg REST catalog (Lakekeeper or Apache Polaris)"
# called for in B2. Lakekeeper is Apache-2.0, Rust-based; every Funnel-
# internal dataset registers under the `_funnel.<object_type>.*` namespace.
#
# Production shape:
#   - Separate `migrate` one-shot that runs the schema bump before `serve`.
#   - Dedicated Postgres role + database, dedicated schema (not public).
#   - Server is stateless — scale with `deploy.replicas`; Postgres is
#     authoritative.
#   - Encryption key for vended S3 credentials mounted from an env var
#     backed by your secret manager (Vault / Doppler / AWS Secrets
#     Manager). DO NOT commit a real key to the repo.
#   - Hardened: read_only fs, no-new-privileges, capability drop, pids
#     limit, log rotation.
#
# IMPORTANT: Lakekeeper's env var names AND bootstrap API schema evolve
# between minor releases. The names below are confirmed against the pinned
# image digest; if you bump the tag, re-verify against that version's
# /docs/configuration page before `up -d`.
#
# Compose in production with:
#   docker compose \
#     -f docker-compose-files.prod/postgres.docker-compose.yml \
#     -f docker-compose-files.prod/minio.docker-compose.yml \
#     -f docker-compose-files.prod/keycloak.docker-compose.yml \
#     -f docker-compose-files.prod/lakekeeper.docker-compose.yml \
#     up -d
# ---------------------------------------------------------------------------

x-lakekeeper-base: &lakekeeper-base
  # Pin to a digest before deploy:
  #   docker pull quay.io/lakekeeper/lakekeeper:latest-main
  #   docker inspect --format='{{index .RepoDigests 0}}' quay.io/lakekeeper/lakekeeper:latest-main
  # and replace the tag below with the returned `image@sha256:...` form.
  # NB: the canonical image path is `lakekeeper/lakekeeper`, not
  # `lakekeeper/catalog` (latter was a transient alias prior to v0.5).
  image: quay.io/lakekeeper/catalog:latest-main
  restart: unless-stopped
  # read_only intentionally off — the lakekeeper binary writes local
  # scratch inside its working directory (${HOME}/.lakekeeper) and
  # Docker's tmpfs hook is not enough for the embedded rust cache
  # layout on startup.
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=128m
  ulimits:
    nofile: { soft: 65536, hard: 65536 }
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"
  networks:
    - lakekeeper-internal
    - default

x-lakekeeper-env: &lakekeeper-env
  # --- Metadata store (Postgres, dedicated role+schema) ---------------
  LAKEKEEPER__PG_HOST_R: postgres
  LAKEKEEPER__PG_HOST_W: postgres
  LAKEKEEPER__PG_PORT: 5432
  LAKEKEEPER__PG_DATABASE: ${LAKEKEEPER_DB_NAME:-lakekeeper}
  LAKEKEEPER__PG_USER: ${LAKEKEEPER_DB_USER:-lakekeeper}
  LAKEKEEPER__PG_PASSWORD: ${LAKEKEEPER_DB_PASSWORD:-lakekeeper_pw}
  LAKEKEEPER__PG_SSL_MODE: disable
  # --- Encryption of vended S3 credentials (32 bytes hex) -------------
  # Generate: openssl rand -hex 32
  # Rotate with care — re-encrypts every warehouse credential in place.
  LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_PG_ENCRYPTION_KEY:-change-me-use-a-32-byte-hex-key-generated-via-openssl-rand}
  # --- Server ---------------------------------------------------------
  LAKEKEEPER__LISTEN_PORT: 8181
  LAKEKEEPER__BASE_URI: ${LAKEKEEPER_BASE_URI:-http://lakekeeper:8181}
  LAKEKEEPER__SECRET_BACKEND: postgres
  # --- Authorization — OIDC via Keycloak; leave unset for anonymous --
  # LAKEKEEPER__OPENID_PROVIDER_URI: http://keycloak:8086/realms/tellus
  # LAKEKEEPER__OPENID_AUDIENCE: lakekeeper
  # LAKEKEEPER__OPENID_SCOPE: openid profile email
  # --- Observability --------------------------------------------------
  LAKEKEEPER__LOG_LEVEL: info
  LAKEKEEPER__LOG_FORMAT: json
  RUST_BACKTRACE: "0"

services:
  # -------------------------------------------------------------------------
  # One-shot: create the catalog's Postgres database + role. Idempotent.
  # -------------------------------------------------------------------------
  lakekeeper-db-init:
    image: postgres:16-alpine
    container_name: tellus-lakekeeper-db-init
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${DB_USER:-tellus}
      PGPASSWORD: ${DB_PASSWORD:-tellus123}
      LAKEKEEPER_DB_NAME: ${LAKEKEEPER_DB_NAME:-lakekeeper}
      LAKEKEEPER_DB_USER: ${LAKEKEEPER_DB_USER:-lakekeeper}
      LAKEKEEPER_DB_PASSWORD: ${LAKEKEEPER_DB_PASSWORD:-lakekeeper_pw}
    entrypoint:
      - /bin/sh
      - -eu
      - -c
      - |
        until pg_isready -h postgres -U "$$PGUSER" >/dev/null 2>&1; do
          echo 'waiting for postgres...'; sleep 2;
        done
        psql -v ON_ERROR_STOP=1 -d postgres <<SQL
          SELECT 'CREATE ROLE ' || quote_ident('$$LAKEKEEPER_DB_USER') || ' LOGIN PASSWORD ' || quote_literal('$$LAKEKEEPER_DB_PASSWORD')
          WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '$$LAKEKEEPER_DB_USER')\gexec
          SELECT 'CREATE DATABASE ' || quote_ident('$$LAKEKEEPER_DB_NAME') || ' OWNER ' || quote_ident('$$LAKEKEEPER_DB_USER')
          WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = '$$LAKEKEEPER_DB_NAME')\gexec
        SQL
        echo 'Lakekeeper database ready'
    networks: [default]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "2" } }
    security_opt: [no-new-privileges:true]

  # -------------------------------------------------------------------------
  # One-shot: run Lakekeeper's schema migration. MUST complete before
  # `lakekeeper` serves traffic. Re-runnable — migrations are versioned.
  # -------------------------------------------------------------------------
  lakekeeper-migrate:
    <<: *lakekeeper-base
    container_name: tellus-lakekeeper-migrate
    restart: "no"
    depends_on:
      lakekeeper-db-init:
        condition: service_completed_successfully
    environment:
      <<: *lakekeeper-env
    command: ["migrate"]

  # -------------------------------------------------------------------------
  # Lakekeeper server — stateless; scale via `deploy.replicas`.
  # If you scale > 1, remove `container_name` below.
  # -------------------------------------------------------------------------
  lakekeeper:
    <<: *lakekeeper-base
    container_name: tellus-lakekeeper
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    environment:
      <<: *lakekeeper-env
    command: ["serve"]
    ports:
      - "127.0.0.1:8181:8181"    # Iceberg REST endpoint (clients connect here)
      - "127.0.0.1:8182:8182"    # Management + health
    # The lakekeeper image is distroless (no sh / wget / curl) so we
    # cannot run a shell probe. Docker has no built-in TCP probe, so we
    # drop the healthcheck and rely on the `restart: unless-stopped`
    # policy. External uptime checks should probe GET /health on 8181.
    deploy:
      resources:
        limits:   { cpus: "2.0", memory: 1G }
        reservations: { cpus: "0.5", memory: 256M }

  # -------------------------------------------------------------------------
  # MinIO bucket for the warehouse. Same one-shot pattern as
  # `quickwit-bucket-init`.
  # -------------------------------------------------------------------------
  iceberg-bucket-init:
    image: minio/mc:RELEASE.2024-10-02T08-27-28Z
    container_name: tellus-iceberg-bucket-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -eu
      - -c
      - |
        mc alias set tellus http://minio:9000 "$${MINIO_ROOT_USER:-minioadmin}" "$${MINIO_ROOT_PASSWORD:-minioadmin}"
        mc mb --ignore-existing tellus/iceberg-warehouse
        echo 'Iceberg warehouse bucket ready'
    networks: [default]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "2" } }
    security_opt: [no-new-privileges:true]

  # -------------------------------------------------------------------------
  # Warehouse bootstrap is ENVIRONMENT-SPECIFIC and lives in your
  # provisioning tool (Terraform / Pulumi / the CI job that runs after
  # `docker compose up`). The correct endpoint + body schema vary by
  # Lakekeeper minor release — do not embed a one-shot here in prod.
  #
  # For reference, the sequence against v0.4.x is:
  #
  #   1. POST /management/v1/bootstrap
  #      body: {"accept-terms-of-use": true, "is-operator": true}
  #   2. POST /management/v1/warehouse
  #      body: { "warehouse-name": "...",
  #              "project-id": "<uuid>",
  #              "storage-profile": { "type": "s3", ... },
  #              "storage-credential": { ... } }
  #
  # Run these from your deploy pipeline, not from compose.
  # -------------------------------------------------------------------------

networks:
  # Internal plane for lakekeeper -> postgres chatter. The `default`
  # network is how the catalog reaches MinIO and how external clients
  # (Spark / DuckDB / PyIceberg) reach :8181.
  lakekeeper-internal:
    driver: bridge
    name: tellus-lakekeeper-internal
