# ---------------------------------------------------------------------------
# Temporal — Funnel workflow orchestrator (Task B3)
# ---------------------------------------------------------------------------
# Production-shaped deployment:
#   - No `auto-setup` dev image — schemas bootstrapped by an explicit job.
#   - Roles split across independent containers so each scales on its own
#     resource axis (history is the hot one; frontend is stateless).
#   - Advanced visibility via OpenSearch; Postgres holds durable state.
#   - Internal-only network (`temporal-internal`) for role-to-role gRPC;
#     only the frontend + UI publish to the host.
#   - Dynamic config & server config mounted read-only so tuning is
#     reviewed in Git, not edited in a running container.
#
# IMPORTANT: `numHistoryShards` is set at first DB init and IS IMMUTABLE.
# Change it before you run `temporal-schema-setup` for the first time or
# you will have to drop and rebuild the cluster.
#
# Compose in production with:
#   docker compose \
#     -f docker-compose-files.prod/postgres.docker-compose.yml \
#     -f docker-compose-files.prod/opensearch.docker-compose.yml \
#     -f docker-compose-files.prod/temporal.docker-compose.yml \
#     up -d
# ---------------------------------------------------------------------------

x-temporal-base: &temporal-base
  # Pin to a digest before deploy:
  #   docker pull temporalio/server:1.24.2
  #   docker inspect --format='{{index .RepoDigests 0}}' temporalio/server:1.24.2
  # and replace the tag below with the returned `image@sha256:...` form.
  image: temporalio/server:1.24.2
  restart: unless-stopped
  # The Temporal server image writes its rendered config to
  # /etc/temporal/config/docker.yaml at every startup, so read_only=true
  # breaks it. We keep the rest of the hardening (no-new-privileges,
  # capability drop, pids/ulimit caps).
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=256m
  ulimits:
    nofile: { soft: 65536, hard: 65536 }
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"
  networks:
    - default

x-temporal-env: &temporal-env
  # Persistence — workflow state
  DB: postgres12
  DB_PORT: 5432
  POSTGRES_SEEDS: postgres
  POSTGRES_USER: ${TEMPORAL_DB_USER:-temporal}
  POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:-temporal_pw}
  DBNAME: ${TEMPORAL_DB_NAME:-temporal}
  VISIBILITY_DBNAME: ${TEMPORAL_VISIBILITY_DB_NAME:-temporal_visibility}
  # Advanced visibility — OpenSearch (mirrors ES API v7)
  ENABLE_ES: "true"
  ES_SEEDS: opensearch
  ES_VERSION: v7
  ES_SCHEME: http
  ES_PORT: 9200
  ES_VIS_INDEX: temporal_visibility_v1_prod
  # Server-side config lives in a mounted file; we keep the env schema
  # narrow so the templating image generates a deterministic config.
  #
  # Temporal binds gRPC to a single routable IP (not 0.0.0.0) because
  # ringpop's broadcast/advertise address must be a real address, not a
  # wildcard — the server refuses to start otherwise. Therefore every
  # temporal-* container MUST be single-homed: only the `default`
  # network. The previous `temporal-internal` plane was a hardening
  # nicety, but it caused dual-homing and the entrypoint's NIC
  # auto-detection picked the WRONG interface (the role-only one), so
  # application clients on `default` got connection-refused.
  #
  # If you reintroduce role-to-role isolation later, set both
  # BIND_ON_IP and TEMPORAL_BROADCAST_ADDRESS to the routable IP on
  # whichever network you want exposed — never to 0.0.0.0.
  NUM_HISTORY_SHARDS: ${TEMPORAL_NUM_HISTORY_SHARDS:-512}
  LOG_LEVEL: info
  LOG_FORMAT: json
  TEMPORAL_DYNAMIC_CONFIG_FILE: /etc/temporal/dynamicconfig/prod.yaml
  PROMETHEUS_ENDPOINT: "0.0.0.0:9091"

services:
  # -------------------------------------------------------------------------
  # Bootstrap the two Temporal DBs and the dedicated role. Idempotent.
  # -------------------------------------------------------------------------
  temporal-db-init:
    image: postgres:16-alpine
    container_name: tellus-temporal-db-init
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${DB_USER:-tellus}
      PGPASSWORD: ${DB_PASSWORD:-tellus123}
      TEMPORAL_DB_USER: ${TEMPORAL_DB_USER:-temporal}
      TEMPORAL_DB_PASSWORD: ${TEMPORAL_DB_PASSWORD:-temporal_pw}
      TEMPORAL_DB_NAME: ${TEMPORAL_DB_NAME:-temporal}
      TEMPORAL_VISIBILITY_DB_NAME: ${TEMPORAL_VISIBILITY_DB_NAME:-temporal_visibility}
    entrypoint:
      - /bin/sh
      - -eu
      - -c
      - |
        until pg_isready -h postgres -U "$$PGUSER" >/dev/null 2>&1; do
          echo 'waiting for postgres...'; sleep 2;
        done
        # Bash-substitute env vars into the SQL before piping to psql —
        # the \gexec meta-command requires stdin/heredoc mode (not -c).
        psql -v ON_ERROR_STOP=1 -d postgres <<SQL
          SELECT 'CREATE ROLE ' || quote_ident('$$TEMPORAL_DB_USER') || ' LOGIN PASSWORD ' || quote_literal('$$TEMPORAL_DB_PASSWORD')
          WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '$$TEMPORAL_DB_USER')\gexec
          SELECT 'CREATE DATABASE ' || quote_ident('$$TEMPORAL_DB_NAME') || ' OWNER ' || quote_ident('$$TEMPORAL_DB_USER')
          WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = '$$TEMPORAL_DB_NAME')\gexec
          SELECT 'CREATE DATABASE ' || quote_ident('$$TEMPORAL_VISIBILITY_DB_NAME') || ' OWNER ' || quote_ident('$$TEMPORAL_DB_USER')
          WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = '$$TEMPORAL_VISIBILITY_DB_NAME')\gexec
        SQL
        echo 'Temporal databases ready'
    networks: [default]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "2" } }
    security_opt: [no-new-privileges:true]

  # -------------------------------------------------------------------------
  # Run Temporal's SQL + OpenSearch schema bootstrap. Uses the admin-tools
  # image which ships `temporal-sql-tool` and the schema files under
  # /etc/temporal/schema/.
  # -------------------------------------------------------------------------
  temporal-schema-setup:
    image: temporalio/admin-tools:1.24.2-tctl-1.18.1-cli-0.13.2
    container_name: tellus-temporal-schema-setup
    restart: "no"
    depends_on:
      temporal-db-init:
        condition: service_completed_successfully
      opensearch:
        condition: service_healthy
    environment:
      <<: *temporal-env
      SQL_PLUGIN: postgres12
      SQL_HOST: postgres
      SQL_PORT: 5432
      SQL_USER: ${TEMPORAL_DB_USER:-temporal}
      SQL_PASSWORD: ${TEMPORAL_DB_PASSWORD:-temporal_pw}
    entrypoint:
      - /bin/sh
      - -eu
      - -c
      - |
        # --- Workflow schema ------------------------------------------
        temporal-sql-tool --database "$$DBNAME" setup-schema -v 0.0 || true
        temporal-sql-tool --database "$$DBNAME" update-schema -d /etc/temporal/schema/postgresql/v12/temporal/versioned

        # --- Visibility schema (PG fallback; OpenSearch overtakes reads)
        temporal-sql-tool --database "$$VISIBILITY_DBNAME" setup-schema -v 0.0 || true
        temporal-sql-tool --database "$$VISIBILITY_DBNAME" update-schema -d /etc/temporal/schema/postgresql/v12/visibility/versioned

        # --- OpenSearch visibility ------------------------------------
        # Create the index directly — the template PUT is skipped because
        # the shipped index_template_v7.json uses the legacy `order` key
        # that OpenSearch composable `_index_template` rejects. Temporal
        # only *reads* through the index path, so the template is an
        # optimisation for future rollovers, not a hard requirement here.
        curl -sS -X PUT "http://$$ES_SEEDS:$$ES_PORT/$$ES_VIS_INDEX" \
          -H 'content-type: application/json' -d '{}' \
          | tee /dev/stderr \
          | grep -q -E '"acknowledged":true|resource_already_exists'

        echo 'Temporal schemas ready'
    networks: [default]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "2" } }
    security_opt: [no-new-privileges:true]

  # -------------------------------------------------------------------------
  # Frontend — gRPC / HTTP ingress. Stateless; scale with `deploy.replicas`.
  # (Remove `container_name` below if you raise the replica count.)
  # -------------------------------------------------------------------------
  temporal-frontend:
    <<: *temporal-base
    container_name: tellus-temporal-frontend
    depends_on:
      temporal-schema-setup:
        condition: service_completed_successfully
    environment:
      <<: *temporal-env
      SERVICES: frontend
    volumes:
      - ./temporal/dynamicconfig:/etc/temporal/dynamicconfig:ro
    ports:
      - "127.0.0.1:7233:7233"    # gRPC (SDK)
      - "127.0.0.1:7243:7243"    # HTTP gateway
      - "127.0.0.1:9091:9091"    # Prometheus metrics
    healthcheck:
      # temporalio/server:1.24.2 does NOT bundle grpc-health-probe (that
      # binary shipped only in the admin-tools image). Fall back to a TCP
      # probe on the gRPC port via netcat, which the server image has.
      # Temporal binds gRPC to the container's routable IP (not 127.0.0.1)
      # once ringpop advertises it. Probe via $$(hostname) which resolves
      # to the container's own address inside the bridge network.
      test: ["CMD-SHELL", "nc -z \"$$(hostname)\" 7233 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:   { cpus: "2.0", memory: 2G }
        reservations: { cpus: "0.5", memory: 512M }

  # -------------------------------------------------------------------------
  # History — owns workflow execution state. Scale-critical.
  # Internal-only: no host port publish.
  # -------------------------------------------------------------------------
  temporal-history:
    <<: *temporal-base
    container_name: tellus-temporal-history
    depends_on:
      temporal-schema-setup:
        condition: service_completed_successfully
    environment:
      <<: *temporal-env
      SERVICES: history
    volumes:
      - ./temporal/dynamicconfig:/etc/temporal/dynamicconfig:ro
    # Expose Prometheus only — no gRPC host binding.
    ports:
      - "127.0.0.1:9095:9091"
    healthcheck:
      test: ["CMD-SHELL", "nc -z \"$$(hostname)\" 7234 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:   { cpus: "4.0", memory: 4G }
        reservations: { cpus: "1.0", memory: 1G }

  # -------------------------------------------------------------------------
  # Matching — task-queue broker between workflows and workers.
  # Internal-only.
  # -------------------------------------------------------------------------
  temporal-matching:
    <<: *temporal-base
    container_name: tellus-temporal-matching
    depends_on:
      temporal-schema-setup:
        condition: service_completed_successfully
    environment:
      <<: *temporal-env
      SERVICES: matching
    volumes:
      - ./temporal/dynamicconfig:/etc/temporal/dynamicconfig:ro
    ports:
      - "127.0.0.1:9093:9091"
    healthcheck:
      test: ["CMD-SHELL", "nc -z \"$$(hostname)\" 7235 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:   { cpus: "2.0", memory: 2G }
        reservations: { cpus: "0.5", memory: 512M }

  # -------------------------------------------------------------------------
  # Internal worker — archival, scanner, history cleanup. NOT the Funnel
  # app workers; those live in the Node application container.
  # -------------------------------------------------------------------------
  temporal-internal-worker:
    <<: *temporal-base
    container_name: tellus-temporal-internal-worker
    depends_on:
      temporal-schema-setup:
        condition: service_completed_successfully
    environment:
      <<: *temporal-env
      SERVICES: worker
    volumes:
      - ./temporal/dynamicconfig:/etc/temporal/dynamicconfig:ro
    ports:
      - "127.0.0.1:9094:9091"
    healthcheck:
      test: ["CMD-SHELL", "nc -z \"$$(hostname)\" 7239 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:   { cpus: "1.0", memory: 1G }
        reservations: { cpus: "0.25", memory: 256M }

  # -------------------------------------------------------------------------
  # Temporal UI. Distroless base — no curl/wget, so we probe via
  # `/usr/local/bin/wget` only if present; fall back to TCP probe.
  # -------------------------------------------------------------------------
  temporal-ui:
    image: temporalio/ui:2.30.1
    container_name: tellus-temporal-ui
    restart: unless-stopped
    depends_on:
      temporal-frontend:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal-frontend:7233
      TEMPORAL_CORS_ORIGINS: ${TEMPORAL_UI_CORS_ORIGINS:-http://localhost:3000}
      TEMPORAL_UI_PORT: 8088
      TEMPORAL_NOTIFY_ON_NEW_VERSION: "false"
    ports:
      - "127.0.0.1:8088:8088"
    healthcheck:
      # Distroless lacks curl/wget; use a Go-style TCP probe via busybox-style /proc check.
      # Any response on 8088 counts; Temporal UI's root returns 200.
      test: ["CMD-SHELL", "timeout 2 sh -c '</dev/tcp/127.0.0.1/8088' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt: [no-new-privileges:true]
    # UI image writes its rendered config to ./config/docker.yaml on boot,
    # so read_only=true prevents startup. Drop the flag; keep the rest of
    # the hardening.
    logging: { driver: json-file, options: { max-size: "20m", max-file: "3" } }
    networks: [default]

  # -------------------------------------------------------------------------
  # One-shot: create the `tellus-funnel` namespace with 30-day retention.
  # NOTE (FUNN-ISO): in production the app runs in strict mode — set
  # TELLUS_ENVIRONMENT_ID / TEMPORAL_NAMESPACE / TEMPORAL_TASK_QUEUE on the
  # app service and EDIT the namespace name in the one-shot below to match
  # (production namespace provisioning belongs to deployment infra; the
  # worker refuses to start against a non-existent namespace in strict
  # mode).
  # Runs after frontend is healthy; re-runnable (409 on re-create tolerated).
  # -------------------------------------------------------------------------
  temporal-namespace-init:
    image: temporalio/admin-tools:1.24.2-tctl-1.18.1-cli-0.13.2
    container_name: tellus-temporal-namespace-init
    restart: "no"
    depends_on:
      temporal-frontend:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal-frontend:7233
      TEMPORAL_CLI_ADDRESS: temporal-frontend:7233
    entrypoint:
      - /bin/sh
      - -eu
      - -c
      - |
        temporal operator namespace create tellus-funnel \
          --address temporal-frontend:7233 \
          --retention 30d \
          --description 'Object Data Funnel workflows (B3)' 2>&1 \
          | { grep -v 'already exists' || true; }
        echo 'Temporal namespace tellus-funnel ready'
    networks: [default]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "2" } }
    security_opt: [no-new-privileges:true]

# All temporal-* services share `default` with the rest of the tellus
# stack (postgres / opensearch / minio / the application). No private
# plane — see x-temporal-env note.
