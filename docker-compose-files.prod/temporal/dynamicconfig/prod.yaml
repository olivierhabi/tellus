# ---------------------------------------------------------------------------
# Temporal dynamic config — production tunables (Task B3)
# ---------------------------------------------------------------------------
# Loaded at startup from TEMPORAL_DYNAMIC_CONFIG_FILE. Everything here can
# be reloaded without restart, which is why the *shard count* is pointedly
# NOT here — numHistoryShards is set at DB init and immutable for the life
# of the cluster.
#
# Defaults assume ≤ 100 Object Types and moderate action throughput; raise
# persistence QPS and frontend.rps as you onboard more tenants.
# ---------------------------------------------------------------------------

# --- Frontend -----------------------------------------------------------
frontend.rps:
  - value: 2400
frontend.namespaceRPS.default:
  - value: 2400
frontend.namespaceCount.default:
  - value: 2400
frontend.workerBuildIdSizeLimit:
  - value: 10000

# --- History ------------------------------------------------------------
history.persistenceMaxQPS:
  - value: 3000
history.persistenceNamespaceMaxQPS:
  - value: 1000
history.cacheInitialSize:
  - value: 512
history.cacheMaxSize:
  - value: 8192
history.rps:
  - value: 3000

# --- Matching -----------------------------------------------------------
matching.rps:
  - value: 1200
matching.persistenceMaxQPS:
  - value: 3000

# --- Worker (system) ----------------------------------------------------
worker.persistenceMaxQPS:
  - value: 500

# --- Archival (Funnel history must be archivable for post-mortem) -------
# The filestore target uses a shared bind-mount in dev; prod wires an S3
# URL via the `archival.*.uri` fields of Temporal namespace config.
system.historyArchival:
  - value: enabled
system.visibilityArchival:
  - value: enabled

# --- Replication (inter-cluster — disabled for single-cluster deploys) --
system.enableReadFromHistoryArchival:
  - value: true
system.enableReadFromVisibilityArchival:
  - value: true

# --- Visibility (advanced, OpenSearch-backed) ---------------------------
system.advancedVisibilityWritingMode:
  - value: "on"
system.enableReadVisibilityFromES:
  - value: true
system.visibilityListMaxQPS:
  - value: 100

# --- Retention (namespace default; per-namespace overrides supersede) ---
system.retentionTTL:
  - value: "30d"
