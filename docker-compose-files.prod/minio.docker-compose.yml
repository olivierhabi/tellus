services:
  minio:
    image: minio/minio:RELEASE.2024-10-02T17-50-41Z
    container_name: tellus-minio
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot init container to create the default bucket
  minio-init:
    image: minio/mc:RELEASE.2024-10-02T08-27-28Z
    container_name: tellus-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set tellus http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
        mc mb --ignore-existing tellus/${MINIO_BUCKET:-tellus-uploads};
        mc anonymous set none tellus/${MINIO_BUCKET:-tellus-uploads};
        echo 'Bucket ready';
      "
    restart: "no"

volumes:
  minio_data:
