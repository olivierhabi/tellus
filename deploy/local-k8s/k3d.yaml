# k3d cluster config for local Tellus.
# Created by scripts/k8s-local-up.sh (provider=k3d).
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: tellus-local
servers: 1
agents: 0
kubeAPI:
  host: "127.0.0.1"
ports:
  # App NodePort 30000 → host :3000
  - port: 3000:30000
    nodeFilters:
      - server:0
  # Optional direct PG NodePort for host-side debugging
  - port: 5433:30001
    nodeFilters:
      - server:0
options:
  k3s:
    extraArgs:
      - arg: --disable=traefik
        nodeFilters:
          - server:*
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
