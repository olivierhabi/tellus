# kind cluster config for local Tellus — maps host :3000 → NodePort 30000.
# Created by scripts/k8s-local-up.sh (provider=kind).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
# Cluster name is set by `kind create cluster --name` in k8s-local-up.sh
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "tellus.io/role=control-plane"
    extraPortMappings:
      - containerPort: 30000
        hostPort: 3000
        protocol: TCP
        listenAddress: "127.0.0.1"
      - containerPort: 30001
        hostPort: 5433
        protocol: TCP
        listenAddress: "127.0.0.1"
  # Optional second worker for topology-spread demos; keep off by default
  # to fit 16 GiB developer laptops. Enable with K8S_LOCAL_WORKERS=1.
