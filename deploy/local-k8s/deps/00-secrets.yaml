# Local-only credentials. NEVER reuse these values outside kind/k3d.
# Production must source secrets from AWS Secrets Manager via External Secrets
# (see k8s/external-secrets/).
apiVersion: v1
kind: Secret
metadata:
  name: tellus-local-credentials
  namespace: tenant-local
  labels:
    app.kubernetes.io/part-of: tellus-local
    tellus.io/tenant: local
type: Opaque
stringData:
  # Postgres
  POSTGRES_USER: tellus
  POSTGRES_PASSWORD: tellus_local_pg_pw
  POSTGRES_DB: tellus_db
  PGUSER: tellus
  PGPASSWORD: tellus_local_pg_pw
  PGDATABASE: tellus_db
  # Redis
  REDIS_PASSWORD: tellus_local_redis_pw
  # MinIO / S3
  MINIO_ROOT_USER: tellusminio
  MINIO_ROOT_PASSWORD: tellus_local_minio_pw
  S3_ACCESS_KEY_ID: tellusminio
  S3_SECRET_ACCESS_KEY: tellus_local_minio_pw
  S3_BUCKET: tellus-uploads
