apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: tenant-local
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: tellus-local
    app.kubernetes.io/component: object-storage
    tellus.io/tenant: local
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: minio
  ports:
    - name: s3
      port: 9000
      targetPort: s3
    - name: console
      port: 9001
      targetPort: console
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: tenant-local
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: tellus-local
    app.kubernetes.io/component: object-storage
    tellus.io/tenant: local
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/part-of: tellus-local
        app.kubernetes.io/component: object-storage
        tellus.io/tenant: local
    spec:
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-12-18T13-15-44Z
          imagePullPolicy: IfNotPresent
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: tellus-local-credentials
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tellus-local-credentials
                  key: MINIO_ROOT_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 2Gi
---
# Create the application bucket once MinIO is ready.
# Uses the minio server image + curl/sh fallback is not available; use
# official `minio/mc` floating tag (release tags rotate frequently).
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bootstrap
  namespace: tenant-local
  labels:
    app.kubernetes.io/name: minio-bootstrap
    app.kubernetes.io/part-of: tellus-local
spec:
  backoffLimit: 8
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-bootstrap
        app.kubernetes.io/part-of: tellus-local
        tellus.io/tenant: local
    spec:
      restartPolicy: OnFailure
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mc
          image: minio/mc:latest
          imagePullPolicy: IfNotPresent
          env:
            # mc writes config under $HOME/.mc — must be writable for non-root.
            - name: HOME
              value: /tmp
            - name: MC_CONFIG_DIR
              value: /tmp/.mc
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: tellus-local-credentials
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tellus-local-credentials
                  key: MINIO_ROOT_PASSWORD
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: tellus-local-credentials
                  key: S3_BUCKET
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              mkdir -p "$MC_CONFIG_DIR"
              echo "waiting for minio…"
              until mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
                sleep 2
              done
              mc mb --ignore-existing "local/${S3_BUCKET}"
              mc anonymous set none "local/${S3_BUCKET}" || true
              echo "bucket ready: ${S3_BUCKET}"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
