apiVersion: v1
kind: Service
metadata:
  name: opensearch
  namespace: tenant-local
  labels:
    app.kubernetes.io/name: opensearch
    app.kubernetes.io/part-of: tellus-local
    app.kubernetes.io/component: search
    tellus.io/tenant: local
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: opensearch
  ports:
    - name: http
      port: 9200
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opensearch
  namespace: tenant-local
  labels:
    app.kubernetes.io/name: opensearch
    app.kubernetes.io/part-of: tellus-local
    app.kubernetes.io/component: search
    tellus.io/tenant: local
spec:
  serviceName: opensearch
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opensearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opensearch
        app.kubernetes.io/part-of: tellus-local
        app.kubernetes.io/component: search
        tellus.io/tenant: local
    spec:
      # OpenSearch image expects uid 1000.
      # No privileged sysctl init: kind baseline PSS forbids it. Instead we
      # disable mmap so vm.max_map_count does not need to be raised. The up
      # script still best-effort sets max_map_count on the node for headroom.
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:2.17.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9200
          env:
            - name: discovery.type
              value: single-node
            - name: plugins.security.disabled
              value: "true"
            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
            - name: DISABLE_INSTALL_DEMO_CONFIG
              value: "true"
            - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
              value: "Str0ng!P@ssw0rd-Tellus-Local9"
            - name: bootstrap.memory_lock
              value: "false"
            # Avoids requiring vm.max_map_count=262144 under Pod Security baseline.
            - name: node.store.allow_mmap
              value: "false"
          resources:
            requests:
              cpu: 200m
              memory: 768Mi
            limits:
              cpu: "1.5"
              memory: 1536Mi
          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /_cluster/health
              port: http
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /usr/share/opensearch/data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: opensearch
          app.kubernetes.io/part-of: tellus-local
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
