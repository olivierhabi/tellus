apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: tenant-local
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: tellus-local
    app.kubernetes.io/component: database
    tellus.io/tenant: local
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: pg
      port: 5432
      targetPort: pg
---
# Optional host access for debugging: localhost:5433 → postgres
apiVersion: v1
kind: Service
metadata:
  name: postgres-node
  namespace: tenant-local
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: tellus-local
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: pg
      port: 5432
      targetPort: pg
      nodePort: 30001
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: tenant-local
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: tellus-local
    app.kubernetes.io/component: database
    tellus.io/tenant: local
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: tellus-local
        app.kubernetes.io/component: database
        tellus.io/tenant: local
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          args:
            - postgres
            - -c
            - wal_level=logical
            - -c
            - max_replication_slots=10
            - -c
            - max_wal_senders=10
            - -c
            - shared_buffers=128MB
            - -c
            - max_connections=100
          ports:
            - name: pg
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: tellus-local-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tellus-local-credentials
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: tellus-local-credentials
                  key: POSTGRES_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "tellus", "-d", "tellus_db"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "tellus", "-d", "tellus_db"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: postgres
          app.kubernetes.io/part-of: tellus-local
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
