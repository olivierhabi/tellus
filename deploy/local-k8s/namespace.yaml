apiVersion: v1
kind: Namespace
metadata:
  name: tenant-local
  labels:
    app.kubernetes.io/name: tellus
    app.kubernetes.io/part-of: tellus-local
    tellus.io/tenant: local
    # Match chart PSS posture so deps and app share the same admission rules.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
