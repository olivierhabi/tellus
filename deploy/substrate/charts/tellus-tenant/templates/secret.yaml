{{- if .Values.secret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tellus-tenant.fullname" . }}-secret
  namespace: {{ include "tellus-tenant.namespace" . }}
  labels:
    {{- include "tellus-tenant.labels" . | nindent 4 }}
type: Opaque
{{- with .Values.secret.stringData }}
stringData:
  {{- range $k, $v := . }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
{{- with .Values.secret.data }}
data:
  {{- range $k, $v := . }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
{{- end }}
