# FOUNDRY-GAPS §3 — Falco runtime-security rule (committed artifact).
#
# Installed via the falcosecurity/falco Helm chart `customRules` map. Detects,
# at the syscall level (modern_ebpf), credential-access and reverse-shell tells
# inside any container on the cluster. Proven on real k3d (linuxkit 6.12 kernel,
# BTF present): the rule loaded (schema validation ok) and fired CRITICAL on an
# `nc` execve inside a container.
#
#   helm install falco falcosecurity/falco -n falco --create-namespace \
#     --set driver.kind=modern_ebpf --set-file customRules."tellus-tripwire\.yaml"=deploy/substrate/falco/tellus-tripwire.yaml
customRules:
  tellus-tripwire.yaml: |-
    - rule: Tellus UDF Tripwire
      desc: Tellus runtime tripwire - sensitive read or suspicious exec in a container
      condition: >
        container and
        ((spawned_process and proc.name in (ncat, nc, tellus_intruder)) or
         (open_read and fd.name=/etc/shadow))
      output: "TELLUS-TRIPWIRE (rule_kind=%evt.type proc=%proc.name cmd=%proc.cmdline file=%fd.name container=%container.id image=%container.image.repository)"
      priority: CRITICAL
      tags: [tellus, mitre_credential_access]
