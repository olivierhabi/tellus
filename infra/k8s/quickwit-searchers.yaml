# ---------------------------------------------------------------------------
# Quickwit searcher StatefulSet — Task B8
#
# Reproduces Palantir's "download index files to search node disks"
# pattern using local NVMe volumes + Quickwit's split-cache prefetch.
#
# Topology (per spec):
#   * 3 replicas for live queries (search-live).
#   * 3 replicas for replacement-pipeline cutover prewarm (search-secondary).
#   * Each replica gets a 200 GB NVMe PVC mounted at /quickwit/data/cache;
#     Quickwit searcher.split_cache.max_num_bytes leaves 10% headroom
#     (180 GB).
#
# Deployment:
#   kubectl apply -f infra/k8s/quickwit-searchers.yaml
#
# After the StatefulSet is Running, point the Ontology Engine at the
# searchers via env:
#   QUICKWIT_SEARCHERS=<ss-pod-0>:7280,<ss-pod-1>:7280,<ss-pod-2>:7280
#   QUICKWIT_SEARCHERS += ,<ss-v2-pod-0>:7280!secondary,... for cutover.
#
# NVMe storage class notes:
#   * AWS: use `io2` or `gp3` with PV volume binding mode `WaitForFirstConsumer`.
#   * GCP: use `pd-ssd` with `reclaimPolicy: Retain` to avoid losing warm caches
#     on pod reschedules.
#   * On-prem: set `local-nvme` storage class backed by `local-static-provisioner`.
# ---------------------------------------------------------------------------
---
apiVersion: v1
kind: Service
metadata:
  name: quickwit-searcher
  labels:
    app: quickwit
    tier: searcher
spec:
  clusterIP: None
  selector:
    app: quickwit
    tier: searcher
    role: live
  ports:
    - name: rest
      port: 7280
      targetPort: 7280
    - name: grpc
      port: 7281
      targetPort: 7281
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: quickwit-searcher-config
data:
  quickwit.yaml: |
    version: 0.8
    cluster_id: tellus-qw
    metastore_uri: postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/quickwit_metastore
    default_index_root_uri: s3://${QW_BUCKET}/
    rest:
      listen_addr: 0.0.0.0:7280
    grpc:
      listen_addr: 0.0.0.0:7281
    searcher:
      # 180 GB headroom under the 200 GB NVMe PVC.
      split_cache:
        max_num_bytes: 180000000000
        max_num_splits: 500
        num_concurrent_downloads: 4
      aggregation_memory_limit: 4000000000
      fast_field_cache_capacity: 8000000000
      max_num_concurrent_split_searches: 200
    # Searcher-only role: no indexer, no metastore, no control plane.
    enabled_services:
      - searcher
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: quickwit-searcher-live
  labels:
    app: quickwit
    tier: searcher
    role: live
spec:
  serviceName: quickwit-searcher
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: quickwit
      tier: searcher
      role: live
  template:
    metadata:
      labels:
        app: quickwit
        tier: searcher
        role: live
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 1000
      containers:
        - name: searcher
          image: quickwit/quickwit:0.8.1
          command: ["quickwit"]
          args: ["run", "--config", "/etc/quickwit/quickwit.yaml", "--service", "searcher"]
          ports:
            - containerPort: 7280
              name: rest
            - containerPort: 7281
              name: grpc
          envFrom:
            - secretRef:
                name: tellus-funnel-secrets
          env:
            - name: RUST_LOG
              value: info
          volumeMounts:
            - name: config
              mountPath: /etc/quickwit
              readOnly: true
            - name: cache
              mountPath: /quickwit/data/cache
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
            limits:
              cpu: "4"
              memory: 16Gi
          readinessProbe:
            httpGet:
              path: /api/v1/health/livez
              port: rest
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/health/livez
              port: rest
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: quickwit-searcher-config
  volumeClaimTemplates:
    - metadata:
        name: cache
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-nvme
        resources:
          requests:
            storage: 200Gi
---
# Secondary StatefulSet — pre-warmed for replacement-pipeline cutover
# (spec §B9). Same shape, different role label and PVC name so the two
# sets don't share cache volumes.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: quickwit-searcher-secondary
  labels:
    app: quickwit
    tier: searcher
    role: secondary
spec:
  serviceName: quickwit-searcher
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: quickwit
      tier: searcher
      role: secondary
  template:
    metadata:
      labels:
        app: quickwit
        tier: searcher
        role: secondary
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 1000
      containers:
        - name: searcher
          image: quickwit/quickwit:0.8.1
          command: ["quickwit"]
          args: ["run", "--config", "/etc/quickwit/quickwit.yaml", "--service", "searcher"]
          ports:
            - containerPort: 7280
              name: rest
            - containerPort: 7281
              name: grpc
          envFrom:
            - secretRef:
                name: tellus-funnel-secrets
          volumeMounts:
            - name: config
              mountPath: /etc/quickwit
              readOnly: true
            - name: cache
              mountPath: /quickwit/data/cache
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
            limits:
              cpu: "4"
              memory: 16Gi
          readinessProbe:
            httpGet:
              path: /api/v1/health/livez
              port: rest
            initialDelaySeconds: 15
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: quickwit-searcher-config
  volumeClaimTemplates:
    - metadata:
        name: cache
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-nvme
        resources:
          requests:
            storage: 200Gi
