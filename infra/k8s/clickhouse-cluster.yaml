# ---------------------------------------------------------------------------
# Task B10 — Production ClickHouse topology (3 shards × 2 replicas).
#
# Each (shard, replica) is a dedicated StatefulSet so a node loss only
# affects one shard/replica pair, and ReplicatedMergeTree replicates
# writes between the two replicas of the same shard via ZooKeeper.
#
# Assumes ClickHouse Keeper (or ZK) is deployed separately at
# svc/clickhouse-keeper:9181. Remote servers are declared in the cluster
# config via a ConfigMap mounted at /etc/clickhouse-server/config.d.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: tellus-clickhouse
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: tellus-clickhouse
  labels:
    app: clickhouse
    tier: searcharound
spec:
  clusterIP: None
  selector:
    app: clickhouse
  ports:
    - name: native
      port: 9000
      targetPort: 9000
    - name: http
      port: 8123
      targetPort: 8123
    - name: interserver
      port: 9009
      targetPort: 9009
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-cluster-config
  namespace: tellus-clickhouse
data:
  cluster.xml: |
    <clickhouse>
      <remote_servers>
        <tellus_search_arounds>
          <shard>
            <internal_replication>true</internal_replication>
            <replica><host>clickhouse-s1-r1-0.clickhouse</host><port>9000</port></replica>
            <replica><host>clickhouse-s1-r2-0.clickhouse</host><port>9000</port></replica>
          </shard>
          <shard>
            <internal_replication>true</internal_replication>
            <replica><host>clickhouse-s2-r1-0.clickhouse</host><port>9000</port></replica>
            <replica><host>clickhouse-s2-r2-0.clickhouse</host><port>9000</port></replica>
          </shard>
          <shard>
            <internal_replication>true</internal_replication>
            <replica><host>clickhouse-s3-r1-0.clickhouse</host><port>9000</port></replica>
            <replica><host>clickhouse-s3-r2-0.clickhouse</host><port>9000</port></replica>
          </shard>
        </tellus_search_arounds>
      </remote_servers>
      <zookeeper>
        <node><host>clickhouse-keeper</host><port>9181</port></node>
      </zookeeper>
      <macros>
        <cluster>tellus_search_arounds</cluster>
      </macros>
    </clickhouse>
---
# ---------------------------------------------------------------------------
# 3 shards × 2 replicas = 6 pods. One StatefulSet per (shard, replica)
# because each needs distinct macros (shard id + replica name) that drive
# ReplicatedMergeTree's ZK path, and StatefulSets don't let us express
# per-pod env from pod ordinal alone without a templating layer.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse-s1-r1
  namespace: tellus-clickhouse
  labels: { app: clickhouse, shard: "1", replica: "1" }
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels: { app: clickhouse, shard: "1", replica: "1" }
  template:
    metadata:
      labels: { app: clickhouse, shard: "1", replica: "1" }
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.8
          ports:
            - { containerPort: 9000, name: native }
            - { containerPort: 8123, name: http }
            - { containerPort: 9009, name: interserver }
          env:
            - { name: SHARD,   value: "01" }
            - { name: REPLICA, value: "r1" }
          volumeMounts:
            - { name: data,    mountPath: /var/lib/clickhouse }
            - { name: cluster, mountPath: /etc/clickhouse-server/config.d, readOnly: true }
          resources:
            requests: { cpu: "4", memory: 16Gi }
            limits:   { cpu: "8", memory: 32Gi }
          readinessProbe:
            tcpSocket: { port: 9000 }
            initialDelaySeconds: 20
            periodSeconds: 5
      volumes:
        - name: cluster
          configMap: { name: clickhouse-cluster-config }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-nvme
        resources:
          requests: { storage: 500Gi }
---
