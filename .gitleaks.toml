[extend]
useDefault = true

[[allowlists]]
description = "UUIDs are identifiers, not credentials (Temporal payload refs, test idempotency keys). Quotes-tolerant: gitleaks 8.24.x extracts the secret with surrounding quotes, 8.30.x without."
regexTarget = "secret"
regexes = [
  '''^\"?[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}\"?$''',
]

[[allowlists]]
description = "Dev-stack MinIO credentials (localhost:9000 docker-compose dev instance only — never production). Exact value, scoped to the two probe/verify scripts that legitimately connect to the local dev bucket."
regexTarget = "secret"
paths = [
  '''(^|/)scripts/_dup_probe\.mjs$''',
  '''(^|/)scripts/verify-partitioned-merge\.ts$''',
]
regexes = [
  '''^\"?kYJtYYunruhlPtOow9PD5FyRa36BXPM\"?$''',
]

[[allowlists]]
description = "litellm historical api_key (commit dd0ea16) — credential rotated + documented in docs/security/litellm-credential-rotation.md; current file carries no key (os.environ). Commit-scoped so a NEW key in this file still fails CI."
paths = ['''^litellm_config\.yaml$''']
commits = ['dd0ea1656dbe647f9a5778576c778d2b9a7e20cf']

[[allowlists]]
description = "Historical committed session-log dump (env excerpts); file removed from the working tree in ae6d39b — findings are historical blobs inside the PR scan range only."
paths = ['''^019fa89f-66cd-7831-8982-dca47293bda6\.md$''']

[[allowlists]]
description = "Secret-scanner unit test contains deliberately planted, non-live credential-shaped fixtures"
paths = [
  '''(^|/)tests/unit/evidence/evidenceAudit-unit\.test\.ts$''',
]

[[allowlists]]
description = "CI/test-only fallback credentials (ephemeral container defaults, never production). Each is either overridden by GitHub secrets in CI (secrets.CI_* with a local-only fallback) or matches the checked-in docker-compose-test.yml service password. Scoped to workflow/compose/test-example files so the same literal in src/ or a real config still fails the build."
paths = [
  '''(^|/)\.github/workflows/ci\.yml$''',
  '''(^|/)\.github/workflows/coverage-gate\.yml$''',
  '''(^|/)docker-compose.*\.yml$''',
  '''(^|/)\.env\.test\.example$''',
  '''(^|/)tests/laneEnv\.ts$''',
]
regexTarget = "secret"
regexes = [
  '''^"?tellus123"?$''',
  '''^"?tellus_ch_pw"?$''',
  '''^"?minioadmin"?$''',
  '''^"?Password123!"?$''',
  '''^"?tellus-confidential-secret-change-me"?$''',
  '''^"?temporal_pw"?$''',
  '''^"?admin"?$''',
]
