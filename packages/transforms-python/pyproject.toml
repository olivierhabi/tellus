# Source: PEP 517/518 (https://peps.python.org/pep-0517/) + https://setuptools.pypa.io/
# + https://build.pypa.io/. This is the tellus PUBLISHED package providing:
#   - the `transforms` library (transforms.api — the Foundry-DX-compatible dev surface:
#     @transform / Input / Output / Pipeline / discover_transforms)
#   - the `tellus-transforms` build/test/lint/lock CLI
# It is NOT scaffolded into user repos. A transforms-python repo declares it as a
# dependency (conda_recipe/meta.yaml `transforms` run-dep) and resolves it into
# requirements.lock — mirroring Foundry, where `transforms` is a conda dep, not
# committed into the repo.
#   # original implementation, not a port (tellus-native packaging)

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tellus-transforms"
version = "0.1.0"
description = "tellus Python transforms framework: transforms.api (Foundry-DX-compatible) + build CLI"
requires-python = ">=3.9"
# The transforms.api runtime methods (.polars()/.pandas()/.duckdb()/write_table()) are
# DECLARED for DX-compatibility but backed by the tellus build runtime at execution time
# (see transforms/api.py UNVERIFIED note). The compute-engine libs are therefore pulled
# by the user's repo as needed, not by this library.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
tellus-transforms = "tellus_transforms.cli:main"

[tool.setuptools]
packages = ["transforms", "tellus_transforms"]
