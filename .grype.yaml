# grype configuration for the cve-scan workflow (.github/workflows/cve-scan.yml).
# Auto-discovered by grype from the repo root. The `pnpm audit --prod` gate uses a
# parallel suppression list in package.json (pnpm.auditConfig.ignoreGhsas); keep the
# two in sync. Every entry below is a deliberately accepted finding with justification.
ignore:
  # --- @opensearch-project/opensearch — malware advisory (blanket, no fix) ---
  # May 2026 npm account-takeover ("Mini Shai-Hulud"). The MALICIOUS releases were
  # 3.5.3 / 3.6.2 / 3.7.0 / 3.8.0. We are pinned to the exact known-good 3.5.1, which
  # predates the 12 May 2026 compromise window — the OpenSearch team's own recommended
  # remediation (roll back to a known-good version). The advisory is a blanket malware
  # flag (>=0, no patched version), so it cannot be cleared by upgrading. See SECURITY.md.
  # Re-evaluate this entry before ever bumping @opensearch-project/opensearch.
  - vulnerability: GHSA-298w-vvm4-ww55
    package:
      name: "@opensearch-project/opensearch"

  # --- undici — dev/test-only, never shipped to production ---
  # undici reaches the tree ONLY via @testcontainers/postgresql (a devDependency used
  # for integration tests). The production image is built with `pnpm install --prod`
  # (Dockerfile), so undici is not present in the deployed artifact. testcontainers 10.x
  # pins undici 5.x, so a forced override would break the test harness. Not exploitable
  # in production. Revisit when testcontainers is upgraded to a line that ships undici >=6.24.
  - vulnerability: CVE-2026-2229
    package:
      name: undici
  - vulnerability: CVE-2026-1526
    package:
      name: undici
  # CVE-2026-12151 (High) — same dev-only posture as the two undici entries
  # above. Fixed in undici 6.27.0, but testcontainers 10.x pins undici 5.x,
  # so an override would break the test harness. Revisit on the testcontainers
  # upgrade tracked above.
  - vulnerability: CVE-2026-12151
    package:
      name: undici

  # --- vitest / vite — test-only toolchain, never shipped to production ---
  # vitest is a devDependency (the unit/integration test runner) and vite is
  # pulled transitively by vitest as its dev-server/build backend. Neither
  # reaches the production image (`pnpm install --prod` in the Dockerfile),
  # so these advisories are not exploitable in a deployed artifact.
  # RESOLVED Sept 2026 (Strix dev-posture remediation): vitest bumped
  # ^4.0.18 → ^4.1.11, which clears CVE-2026-47429 (fixed in the 4.1.0 line)
  # and CVE-2026-84373 (fixed in 4.1.11) — both suppressions removed, full
  # unit lane re-verified green on the bumped toolchain.
  # Remaining: vite → 8.0.16 fixes CVE-2026-53571 (currently resolves
  # 8.0.10); left suppressed as dev-only until the next dev-tooling
  # upgrade pass.
  - vulnerability: CVE-2026-53571
    package:
      name: vite

  # --- extract-zip — dev/test-only (cypress), no fixed version exists ---
  # CVE-2026-56876 (High) reaches the tree ONLY via cypress 13.x (a
  # devDependency used for browser E2E). There is NO patched release of
  # extract-zip 2.x, so it cannot be cleared by an override. The production
  # image is built with `pnpm install --prod` (Dockerfile), so neither
  # cypress nor extract-zip is present in the deployed artifact. Not
  # exploitable in production. Revisit when cypress ships a fixed
  # extract-zip.
  - vulnerability: CVE-2026-56876
    package:
      name: extract-zip
  # CVE-2026-19693 (High) is the same extract-zip 2.0.1 package reached only
  # through Cypress. Grype reports no fixed version, so there is no safe
  # package override to apply. Keep this scoped to the exact CVE + package and
  # remove it when Cypress stops depending on the vulnerable release.
  - vulnerability: CVE-2026-19693
    package:
      name: extract-zip

  # --- braces — dev-only tooling, no fixed version exists ---
  # CVE-2026-93687 (High): braces 3.0.3 is the latest 3.x release and grype
  # reports no fix. It is reached ONLY via chokidar / micromatch under nodemon,
  # ts-node-dev and tsc-alias (all devDependencies); the production image is
  # built with `pnpm install --prod`. Remove when a patched braces ships.
  - vulnerability: CVE-2026-93687
    package:
      name: braces

  # --- http-cache-semantics — install-time only, no fixed version exists ---
  # CVE-2026-93748 / GHSA-ch52-4w7c-c8xp (High): reached only via
  # duckdb > node-gyp > make-fetch-happen, which runs at install/build time to
  # fetch native binaries, never at request time. No patched release exists.
  # Mirrors the pnpm.auditConfig.ignoreGhsas entry in package.json.
  - vulnerability: CVE-2026-93748
    package:
      name: http-cache-semantics
