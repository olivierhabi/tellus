services:
  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: tellus-opensearch
    restart: unless-stopped
    ports:
      - "127.0.0.1:9200:9200"
      - "127.0.0.1:9600:9600"
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      cluster.name: tellus-cluster
    volumes:
      - osdata:/usr/share/opensearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  osdata:
