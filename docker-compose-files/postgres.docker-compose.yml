services:
  postgres:
    image: postgres:16-alpine
    container_name: tellus-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-tellus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tellus123}
      POSTGRES_DB: ${DB_NAME:-tellus_db}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
