# ---------------------------------------------------------------------------
# PB-B9 observability stack — OTel Collector + Prometheus + Grafana.
#
# Starts the three-tier pipe: Tellus API emits OTLP spans/metrics →
# Collector ingests → Prometheus scrapes → Grafana renders the
# checked-in dashboard (infra/grafana/pipeline_builder.json).
#
#   docker compose -f docker-compose-files/monitoring.docker-compose.yml up -d
#
# Smoke:
#   curl -sf http://localhost:9090/-/ready                 # Prometheus
#   curl -sf http://localhost:3003/api/health              # Grafana
#   curl -sf http://localhost:13133/                       # Collector health
#
# Wire the Tellus API to emit:
#   export OTEL_SDK_DISABLED=false
#   export OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
#   npx tsx src/server.ts
# ---------------------------------------------------------------------------

version: "3.9"

networks:
  tellus-observability:
    name: tellus-observability
    driver: bridge

services:
  # --------------------------------------------------------------------- #
  # OTel Collector — receives OTLP from the API pod, exports to the
  # Prometheus endpoint for scrape, logs span metadata at info level.
  # Runs with a capped memory-limiter so an upstream flood doesn't
  # cascade-OOM the shared docker host.
  # --------------------------------------------------------------------- #
  tellus-otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: tellus-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel/otel-collector-config.yaml"]
    volumes:
      - ./monitoring/otel-collector-config.yaml:/etc/otel/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP/gRPC
      - "4318:4318"   # OTLP/HTTP
      - "8888:8888"   # Collector self-telemetry
      - "8889:8889"   # Prometheus exporter target
      - "13133:13133" # Health check
    networks: [tellus-observability]
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # --------------------------------------------------------------------- #
  # Prometheus — scrapes the Tellus API (pipeline metrics),
  # the OTel Collector, and its own self-telemetry. Loads the
  # burn-rate alert rules from infra/prometheus.
  # --------------------------------------------------------------------- #
  tellus-prometheus:
    image: prom/prometheus:v2.50.1
    container_name: tellus-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
      - "--web.listen-address=0.0.0.0:9090"
    volumes:
      - ./monitoring/prometheus-config.yml:/etc/prometheus/prometheus.yml:ro
      - ../infra/prometheus/pipeline_builder_alerts.yml:/etc/prometheus/rules/pipeline_builder_alerts.yml:ro
      - tellus-prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks: [tellus-observability]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - tellus-otel-collector

  # --------------------------------------------------------------------- #
  # Grafana — auto-provisioned with the Prometheus datasource and the
  # pipeline_builder.json dashboard. Admin bootstrap via env. SREs
  # typically rotate GRAFANA_ADMIN_PASSWORD per deployment.
  # --------------------------------------------------------------------- #
  tellus-grafana:
    image: grafana/grafana:10.4.3
    container_name: tellus-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_FEATURE_TOGGLES_ENABLE: "publicDashboards"
    volumes:
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./monitoring/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ../infra/grafana:/var/lib/grafana/dashboards:ro
      - tellus-grafana-data:/var/lib/grafana
    ports:
      - "3003:3000"
    networks: [tellus-observability]
    depends_on:
      - tellus-prometheus

volumes:
  tellus-prometheus-data:
  tellus-grafana-data:
