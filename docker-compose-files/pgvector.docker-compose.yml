# ---------------------------------------------------------------------------
# pgvector — vector search inside Postgres
# ---------------------------------------------------------------------------
# Spec equivalent: "pgvector or Qdrant" (techstack §Vector Index, up to
# 2048-dimensional float vectors).
#
# Use this if you don't want the TimescaleDB image (which already bundles
# pgvector). It's the standard pgvector/pgvector image, on port 5432.
# ---------------------------------------------------------------------------
services:
  postgres-vector:
    image: pgvector/pgvector:pg16
    container_name: tellus-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-tellus_db}
      POSTGRES_USER: ${DB_USER:-tellus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tellus123}
    ports:
      # Use 5433 so this image can run alongside the plain postgres container
      # bound to 5432 in the dev compose.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgvectordata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-tellus} -d $${POSTGRES_DB:-tellus_db}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgvectordata:
