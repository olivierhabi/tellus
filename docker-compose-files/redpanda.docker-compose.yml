# ---------------------------------------------------------------------------
# Redpanda — Kafka-compatible streaming backbone
# ---------------------------------------------------------------------------
# Spec equivalent: "Apache Kafka or Redpanda" (techstack §3.2 Data Layer).
# Used by:
#   • The actions/edits event producer (kafkajs publishes to topic
#     `ontology.events`)
#   • Apache Flink consumers running streaming pipelines
#   • Debezium CDC sink (postgres → ontology.cdc.*)
#
# Single-node mode is sufficient for local dev. The web console (Redpanda
# Console) is exposed on :8080 for live topic/message inspection.
# ---------------------------------------------------------------------------
services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: tellus-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --pandaproxy-addr=0.0.0.0:8082
      - --advertise-pandaproxy-addr=localhost:8082
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "127.0.0.1:9092:9092"   # Kafka API
      - "127.0.0.1:29092:29092" # internal listener
      - "127.0.0.1:8081:8081"   # schema registry
      - "127.0.0.1:8082:8082"   # pandaproxy / REST
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health -X brokers=localhost:9092 | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redpanda-console:
    image: redpandadata/console:v2.7.2
    container_name: tellus-redpanda-console
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:29092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:8081
    ports:
      - "127.0.0.1:8080:8080"

  # One-shot: pre-create topics consumed by the ontology stack
  redpanda-init:
    image: redpandadata/redpanda:v24.2.7
    container_name: tellus-redpanda-init
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        rpk topic create ontology.events     -X brokers=redpanda:29092 -p 3 -r 1 || true;
        rpk topic create ontology.actions    -X brokers=redpanda:29092 -p 3 -r 1 || true;
        rpk topic create ontology.edits      -X brokers=redpanda:29092 -p 3 -r 1 || true;
        rpk topic create ontology.audit      -X brokers=redpanda:29092 -p 3 -r 1 || true;
        rpk topic create ontology.cdc.public -X brokers=redpanda:29092 -p 3 -r 1 || true;
        echo 'Topics ready';
      "
    restart: "no"

volumes:
  redpanda_data:
