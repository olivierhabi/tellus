global:
  scrape_interval: 15s
  evaluation_interval: 15s

# PB-B9 burn-rate alerts — 2%/5%/10% over 1h/6h/24h.
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Primary target: the tellus API's Prometheus exposition on
  # /api/v1/pipelines/metrics. The API pod runs OUTSIDE docker (local
  # npx tsx), so we scrape host.docker.internal.
  - job_name: "tellus-pipeline-builder"
    metrics_path: /api/v1/pipelines/metrics
    static_configs:
      - targets:
          - "host.docker.internal:3000"

  # Secondary: the OTel Collector's Prometheus endpoint — carries
  # trace-derived metrics (span counts, exception counts).
  - job_name: "otel-collector"
    static_configs:
      - targets:
          - "tellus-otel-collector:8889"

  # Operational: Collector self-telemetry (its own memory, pipeline stats).
  - job_name: "otel-collector-self"
    static_configs:
      - targets:
          - "tellus-otel-collector:8888"
