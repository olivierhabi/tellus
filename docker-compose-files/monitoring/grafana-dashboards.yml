apiVersion: 1

providers:
  - name: "pipeline_builder"
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    options:
      # We mount infra/grafana (containing pipeline_builder.json) into
      # this path, so Grafana auto-loads the dashboard at boot.
      path: /var/lib/grafana/dashboards
