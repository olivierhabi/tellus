# ---------------------------------------------------------------------------
# Apache Flink — Pipeline Builder streaming runtime (PB-B5).
# ---------------------------------------------------------------------------
# Spec equivalent: "flink" value of `streaming_runtime` in
# `pipelines.streaming_runtime` (PB-B5). Production-grade topology:
#
#   * 1× JobManager (HA disabled in this compose; a real cluster runs ZK
#     or the native K8s HA setup).
#   * 2× TaskManagers sharing the JobManager so `max_parallelism=16`
#     (ThroughputGuard.DEFAULT_MAX_PARALLELISM) is actually achievable
#     in a local soak. Each TM exposes 8 slots → 16 slots cluster-wide.
#   * 1× SQL Gateway on :8083 — HttpFlinkAdapter.submitSql hits this.
#
# Extension jars:
#   * flink-sql-connector-kafka (wire Kafka sources per PB-B5 compile)
#   * iceberg-flink-runtime      (wire Iceberg sinks via Lakekeeper REST
#                                 catalog; PB-B5 acceptance c + PB-B4
#                                 two-phase commit path).
#
# Mounts:
#   * flink_checkpoints / flink_savepoints are named volumes so Flink's
#     `stop --savepoint` writes land on disk. In prod these go to S3.
#
# Start:
#   docker compose -f docker-compose-files/flink.docker-compose.yml up -d
# ---------------------------------------------------------------------------
services:
  flink-jobmanager:
    image: flink:1.18.1-scala_2.12-java11
    container_name: tellus-flink-jobmanager
    restart: unless-stopped
    ports:
      # NB: port 8081 collides with Redpanda's schema registry on the
      # tellus stack. Flink Dashboard + REST exposed on 18081.
      - "127.0.0.1:18081:8081"
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 1600m
        taskmanager.memory.process.size: 1728m
        parallelism.default: 2
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.savepoints.dir: file:///opt/flink/savepoints
        execution.checkpointing.interval: 60s
        execution.checkpointing.mode: EXACTLY_ONCE
        execution.checkpointing.timeout: 5min
        restart-strategy: fixed-delay
        restart-strategy.fixed-delay.attempts: 3
        restart-strategy.fixed-delay.delay: 10s
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    command: jobmanager
    volumes:
      - flink_checkpoints:/opt/flink/checkpoints
      - flink_savepoints:/opt/flink/savepoints
      - flink_lib:/opt/flink/lib-override
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6

  flink-taskmanager-1:
    image: flink:1.18.1-scala_2.12-java11
    container_name: tellus-flink-taskmanager-1
    restart: unless-stopped
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 8
        taskmanager.memory.process.size: 1728m
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.savepoints.dir: file:///opt/flink/savepoints
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    command: taskmanager
    volumes:
      - flink_checkpoints:/opt/flink/checkpoints
      - flink_savepoints:/opt/flink/savepoints

  flink-taskmanager-2:
    image: flink:1.18.1-scala_2.12-java11
    container_name: tellus-flink-taskmanager-2
    restart: unless-stopped
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 8
        taskmanager.memory.process.size: 1728m
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.savepoints.dir: file:///opt/flink/savepoints
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    command: taskmanager
    volumes:
      - flink_checkpoints:/opt/flink/checkpoints
      - flink_savepoints:/opt/flink/savepoints

  # Flink SQL Gateway — REST surface HttpFlinkAdapter.submitSql calls.
  flink-sql-gateway:
    image: flink:1.18.1-scala_2.12-java11
    container_name: tellus-flink-sql-gateway
    restart: unless-stopped
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    ports:
      # SQL Gateway on 18083 on the host (internal port stays 8083).
      - "127.0.0.1:18083:8083"
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        rest.address: flink-jobmanager
        rest.port: 8081
    command:
      - /opt/flink/bin/sql-gateway.sh
      - start-foreground
      - -Dsql-gateway.endpoint.rest.address=0.0.0.0
      - -Dsql-gateway.endpoint.rest.port=8083
      - -Drest.address=flink-jobmanager
      - -Drest.port=8081
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/info || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  flink_checkpoints: {}
  flink_savepoints: {}
  flink_lib: {}
