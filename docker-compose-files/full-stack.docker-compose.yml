# ---------------------------------------------------------------------------
# Full-stack compose — everything the Ontology Manager needs in dev
# ---------------------------------------------------------------------------
# Brings up the entire reference architecture in one command:
#
#   docker compose -f docker-compose-files/full-stack.docker-compose.yml up -d
#
# Includes:
#   • postgres-ts   — TimescaleDB image (also has pgvector)
#   • opensearch    — search/index nodes
#   • minio         — S3-compatible object storage
#   • redpanda      — Kafka-compatible streaming
#   • flink-*       — streaming compute
#   • spark-*       — large-scale batch compute (opt-in)
#   • nessie        — Iceberg REST catalog
#   • debezium      — Postgres CDC into Kafka
#   • keycloak      — SSO / OAuth 2.0
#   • prometheus,
#     grafana,
#     otel          — monitoring
#
# Each service is otherwise documented in its dedicated compose file in
# this directory; this file is the minimal merge.
# ---------------------------------------------------------------------------
services:
  # -------------------- storage --------------------
  postgres-ts:
    image: timescale/timescaledb-ha:pg16
    container_name: tellus-timescale
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-tellus_db}
      POSTGRES_USER: ${DB_USER:-tellus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tellus123}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [tsdata:/home/postgres/pgdata/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-tellus}"]
      interval: 5s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:2.17.0
    container_name: tellus-opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ports: ["127.0.0.1:9200:9200"]
    volumes: [osdata:/usr/share/opensearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200 || exit 1"]
      interval: 10s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-10-02T17-50-41Z
    container_name: tellus-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 10

  # -------------------- streaming --------------------
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: tellus-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "127.0.0.1:9092:9092"
      - "127.0.0.1:29092:29092"
    volumes: [redpanda_data:/var/lib/redpanda/data]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info -X brokers=localhost:9092 >/dev/null"]
      interval: 10s
      retries: 10

  # -------------------- compute --------------------
  flink-jobmanager:
    image: flink:1.20.0-scala_2.12-java17
    container_name: tellus-flink-jobmanager
    restart: unless-stopped
    command: jobmanager
    ports:
      - "127.0.0.1:8083:8081"
    environment:
      FLINK_PROPERTIES: "jobmanager.rpc.address: flink-jobmanager"

  flink-taskmanager:
    image: flink:1.20.0-scala_2.12-java17
    container_name: tellus-flink-taskmanager
    restart: unless-stopped
    depends_on: [flink-jobmanager]
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2

  spark-master:
    image: apache/spark:3.5.3
    container_name: tellus-spark-master
    restart: unless-stopped
    environment:
      SPARK_MODE: master
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
    ports:
      - "127.0.0.1:7077:7077"
      - "127.0.0.1:8084:8080"

  spark-worker:
    image: apache/spark:3.5.3
    container_name: tellus-spark-worker
    restart: unless-stopped
    depends_on: [spark-master]
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2G
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"

  # -------------------- catalog --------------------
  nessie:
    image: ghcr.io/projectnessie/nessie:0.99.0
    container_name: tellus-nessie
    restart: unless-stopped
    ports:
      - "127.0.0.1:19120:19120"
    environment:
      NESSIE_VERSION_STORE_TYPE: IN_MEMORY

  # -------------------- CDC --------------------
  debezium-connect:
    image: debezium/connect:2.7.3.Final
    container_name: tellus-debezium
    restart: unless-stopped
    depends_on: [redpanda, postgres-ts]
    ports:
      - "127.0.0.1:8085:8083"
    environment:
      BOOTSTRAP_SERVERS: redpanda:29092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: debezium_connect_configs
      OFFSET_STORAGE_TOPIC: debezium_connect_offsets
      STATUS_STORAGE_TOPIC: debezium_connect_statuses
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter

  # -------------------- auth --------------------
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: tellus-keycloak
    restart: unless-stopped
    command: ["start-dev"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: dev-mem
      KC_HTTP_PORT: 8086
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "127.0.0.1:8086:8086"

  # -------------------- monitoring --------------------
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: tellus-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes: [prom_data:/prometheus]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus

  grafana:
    image: grafana/grafana:11.3.0
    container_name: tellus-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes: [grafana_data:/var/lib/grafana]

volumes:
  tsdata:
  osdata:
  miniodata:
  redpanda_data:
  prom_data:
  grafana_data:
