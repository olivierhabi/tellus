# ---------------------------------------------------------------------------
# ClickHouse — Search-Around large-traversal backend (Task B10)
# ---------------------------------------------------------------------------
# Spec equivalent: the fallback engine for graph traversals with hops
# >100k objects (Palantir's two-tier model). In production this is a
# 3-shard × 2-replica cluster; for local dev we run a single node, which
# is behaviorally identical for query planning and the `link_*` MV DDL.
#
# Ingest path: the `link_<source>__<name>__<target>__kafka` tables run as
# ClickHouse Kafka engines pulling from the Redpanda broker in the same
# compose network, matched to the topic names emitted by our CDC producer.
#
# Use with:
#   docker compose \
#     -f docker-compose-files/redpanda.docker-compose.yml \
#     -f docker-compose-files/clickhouse.docker-compose.yml \
#     up -d
# ---------------------------------------------------------------------------

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: tellus-clickhouse
    restart: unless-stopped
    # The `ulimits` and `cap_add: SYS_NICE` are required by ClickHouse's
    # alpine image for its CPU-affinity nudges; without them the server
    # still runs but warns loudly on boot.
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    cap_add:
      - SYS_NICE
      - NET_ADMIN
      - IPC_LOCK
    environment:
      CLICKHOUSE_DB: tellus
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-tellus}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-tellus123}
      # Allow our B10 client to reach the server without a cluster config
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:8123:8123"   # HTTP (used by the B10 ClickHouseClient)
      - "127.0.0.1:9010:9000"   # native TCP (avoid clash w/ MinIO 9000)
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./clickhouse/config.d:/etc/clickhouse-server/config.d:ro
      - ./clickhouse/users.d:/etc/clickhouse-server/users.d:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8123/ping | grep -q Ok."]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  clickhouse_data:
  clickhouse_logs:
