# ---------------------------------------------------------------------------
# Docker Compose — Test Environment
#
# Provides PostgreSQL 16 + OpenSearch 2.17 for running integration and E2E
# tests. Separate from the production docker-compose.yml.
#
# Usage:
#   docker compose -f docker-compose-test.yml up -d
#   npm run test:saturday
#   npm run test:sunday
#   docker compose -f docker-compose-test.yml down -v
# ---------------------------------------------------------------------------

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tellus-test-postgres
    environment:
      POSTGRES_DB: tellus_db
      POSTGRES_USER: tellus
      POSTGRES_PASSWORD: tellus123
    ports:
      - "5432:5432"
    volumes:
      - pgdata-test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tellus -d tellus_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tellus-test

  opensearch:
    image: opensearchproject/opensearch:2.17.0
    container_name: tellus-test-opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=Testing123!
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - osdata-test:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tellus-test

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tellus-test-app
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=tellus_db
      - PGUSER=tellus
      - PGPASSWORD=tellus123
      - OPENSEARCH_URL=http://opensearch:9200
      - PORT=3000
      - NODE_ENV=test
      - DATA_DIR=/app/data
      - RATE_LIMIT_MAX=1000
      - LOG_SKIP_PATHS=/health,/healthz,/ready,/readiness,/liveness
    ports:
      - "3000:3000"
    volumes:
      - appdata-test:/app/data
    networks:
      - tellus-test

volumes:
  pgdata-test:
  osdata-test:
  appdata-test:

networks:
  tellus-test:
    driver: bridge
